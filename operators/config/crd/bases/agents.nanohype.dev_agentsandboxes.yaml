  names:
    kind: AgentSandbox
    listKind: AgentSandboxList
    plural: agentsandboxes
    shortNames:
    - agsbx
    singular: agentsandbox
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.platformRef.name
