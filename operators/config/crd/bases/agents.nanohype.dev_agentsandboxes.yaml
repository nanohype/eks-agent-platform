                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              runtimeClassName:
                description: |-
                  RuntimeClassName selects a Kubernetes RuntimeClass for the session
                  pod — "gvisor" or "kata" for kernel-level isolation of the untrusted
                  agent code. The named RuntimeClass must already exist. Empty uses the
                  cluster's default runtime.
                type: string
              ttlSecondsAfterFinished:
                default: 3600
                description: |-
                  TTLSecondsAfterFinished is how long the AgentSandbox is kept after its
                  session pod terminates before the operator garbage-collects it.
                format: int32
                minimum: 0
                type: integer
              writablePaths:
                description: |-
                  WritablePaths are additional absolute paths the session container may
                  write, mounted as emptyDir alongside /workspace and /tmp.

                  The session runs with a read-only root filesystem, and the only paths this
                  operator can name for an arbitrary image are the two it already mounts:
                  /workspace, which is this CRD's own contract, and /tmp, which every
                  runtime expects. Everything else is a fact about the image — where its
                  user's HOME is, where its toolchain caches — and the image is yours.

                  Declare what your entrypoint writes. Getting this wrong surfaces as the
                  container failing on a read-only filesystem at the moment it tries, which
                  is inside a tool call rather than at startup, so it is worth checking
                  against the image rather than discovering.
                items:
                  maxLength: 256
                  pattern: ^/[A-Za-z0-9._/-]*$
                  type: string
                maxItems: 8
                type: array
            required:
            - image
            - platformRef
            type: object
          status:
            description: AgentSandboxStatus reports the sandbox's reconciled state.
            properties:
              completedAt:
                description: |-
                  CompletedAt is when the session pod first reached a terminal phase —
                  the start of the TTL countdown.
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the last spec.generation reconciled.
                format: int64
                type: integer
              phase:
                description: 'Phase: Pending, Running, Succeeded, Failed, Suspended.'
                type: string
              podName:
                description: PodName is the session pod's name in the tenant namespace.
                type: string
              podPhase:
                description: PodPhase mirrors the session pod's status.phase.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
