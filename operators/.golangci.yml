version: "2"

run:
  timeout: 5m
  go: "1.26"

linters:
  default: none
  # goconst is deliberately absent. From goconst v1.10.0 (bundled by
  # golangci-lint v2.12.0) the checker descends into composite literals and
  # counts the key *and* the value of every map or struct entry. This operator
  # builds IAM policy documents and unstructured Kubernetes objects as
  # map[string]any literals, so every "Effect", "Allow", "2012-10-17" and
  # "argoproj.io" in a document meant to be read against the AWS and Kubernetes
  # references becomes a finding: 456 of them on an unchanged tree, against 0
  # under v2.11.4. Excluding that one AST context yields 0 — every finding comes
  # from it, and none from the assignment, case, return and comparison contexts
  # where goconst has real signal.
  #
  # Suppression cannot be scoped. There is no setting to restore the old
  # contexts; min-occurrences cannot help because the counts run 3-42 and the
  # single true positive of the sweep sat at 3, the floor; and an ignore list
  # would need ~112 patterns, among them "name", "type", "value" and "true" —
  # broad enough to swallow a future real defect while looking targeted.
  #
  # In this codebase a repeated string is usually the payload, not a magic
  # number: its correctness is enforced by a remote schema — a wrong Effect
  # returns MalformedPolicyDocument, a wrong API group fails admission — and
  # hoisting it into a Go constant only makes the document harder to diff
  # against the reference it mirrors.
  #
  # WHAT GUARDS THE CLASS INSTEAD
  #
  # goconst was looking for one thing worth finding: a value written twice that
  # has to stay the same. Occurrence count is the wrong proxy for it. Of 456
  # findings exactly one was a real defect — a rate-limit selector and a route
  # match naming the same header through separate literals — and a coupling
  # written at only two sites never reaches the threshold at all, so tuning it
  # cannot help either.
  #
  # The replacement is an assertion at each site that matters, comparing the two
  # RENDERED outputs rather than either against a constant. A test that asserts
  # a value equals the constant that produced it holds for whatever the constant
  # says; comparing what the two halves actually emit is what makes drift
  # visible. Those live beside the code they pin:
  #
  #   modelgateway_reconcile_unit_test.go   the rate-limit selector against the
  #                                         route match; both policies' targetRefs
  #                                         against the rendered Gateway; the
  #                                         Bedrock port against the egress rule
  #   platform_kms_s3_reconcile_test.go     the tenant Sid seeded and asserted as
  #                                         a fixed literal, so the test file is
  #                                         the third statement of the format and
  #                                         either side drifting from it fails
  #   platform_capability_policy_test.go    the Sid table against the API's
  #                                         capability constants
  #   internal/metricsbridge                the shim's JSON key and port, shared
  #                                         as one symbol so the two halves
  #                                         cannot disagree at all
  #
  # The last of those is the shape to prefer where it is available: a coupling
  # that cannot drift beats one that is checked.
  #
  # Revisit if upstream exposes a knob to scope the checker back. That one
  # setting would make goconst useful here again immediately.
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - gocritic
    - misspell
    - revive
    - bodyclose
    - dupl
    - prealloc
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G104 # Errors unhandled (errcheck covers this)
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: zz_generated\.deepcopy\.go
        linters: [revive, unused, dupl]
      - path: _test\.go
        linters: [dupl, gosec, errcheck]
      # The per-CRD *_controller.go files share the same structural scaffold by
      # design — SetupWithManager wiring, finalizer add/remove, the phase-handling
      # switch, and the requeue/status-write boilerplate are deliberately uniform
      # across reconcilers so the set reads consistently. dupl flags that shared
      # skeleton as duplication; it is intentional, so exclude these files (the
      # substantive reconcile bodies live in the *_reconcile.go files, which dupl
      # still checks).
      - path: internal/controller/.*_controller\.go
        linters: [dupl]

formatters:
  enable:
    - gofmt
    - goimports
