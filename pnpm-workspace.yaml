packages:
  - "packages/*"
  - "examples/*"

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Force patched transitive versions to clear known advisories. ws, form-data and
# ip-address ship at runtime via @kubernetes/client-node inside @eks-agent/client;
# the rest are dev-tree (vitest/tsx, changesets). read-yaml-file is bumped to v2 so
# it pulls js-yaml 4 and the vulnerable js-yaml 3.x line drops out entirely.
#
# The dev-tree entries are load-bearing rather than cosmetic: a build-time package
# executes in CI with this repo's credentials, so it is in scope for the same gate
# the runtime tree is. Until the trivy job was told to include dev dependencies it
# could not see them, and the last two below sat unreported in a green build.
overrides:
  vite: "^8.0.16" # GHSA-v6wh-96g9-6wx3, GHSA-fx2h-pf6j-xcff
  esbuild: "^0.28.1" # GHSA-g7r4-m6w7-qqqr
  ws: "^8.21.0" # CVE-2026-48779 (memory-exhaustion DoS)
  form-data: "^4.0.6" # CVE-2026-12143 (CRLF header injection)
  ip-address: "^10.7.4" # CVE-2026-69192 (leading-zero octets parsed as decimal, splitting SSRF filters from resolvers), GHSA-rxp7-6hxx-x8q5
  js-yaml: "^4.3.1" # CVE-2026-53550 (merge-key quadratic DoS), CVE-2026-59869 (crafted-document DoS), CVE-2026-59870 (!!omap quadratic DoS)
  read-yaml-file: "^3.0.0"
  fast-uri: "^4.2.3" # GHSA-7p8r-x3mc-p8w7 (backslash authority introducer parsed as host), GHSA-333x-w4r6-6crp, GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h
  # GHSA-g3hv-75wg-m249 (globparts amplification DoS), fixed only in minimatch 11.
  # minimatch reaches this tree only through typedoc, which declares ^10.2.5 and
  # calls Minimatch#matchOne, private in 11; patches/typedoc@0.28.20.patch moves
  # that one call to the public match(path, partial). Drop both when a typedoc
  # release declares minimatch 11. minimatch 11 declares brace-expansion
  # ^5.0.12, past CVE-2026-69152, so the brace-expansion override it replaces
  # is no longer needed.
  minimatch: "^11.0.1"
  # CVE-2026-67213 (a custom generator loops forever when size is zero), reached
  # through postcss. The caret is load-bearing and must not be widened to `>=`:
  # the open-ended form resolves to nanoid 6, which is ESM-only and is not the
  # API postcss calls.
  nanoid: "^6.0.0"

peerDependencyRules:
  allowedVersions:
    typescript: "^6.0.0"

patchedDependencies:
  typedoc@0.28.20: patches/typedoc@0.28.20.patch
