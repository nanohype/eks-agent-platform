# A ceiling of zero on a field whose minimum is one.
#
# admissibility: refused minimum spec.scaling.max
apiVersion: agents.nanohype.dev/v1alpha1
kind: AgentFleet
metadata:
  name: corpus-zero-max
  namespace: eks-agent-platform
spec:
  platformRef:
    name: corpus-minimal
  scaling:
    enabled: true
    min: 0
    max: 0
  agents:
    - name: assistant
      systemPrompt: "You are a helpful assistant."
      modelRoute: primary
      image: ghcr.io/example-org/assistant:v0.1.0
