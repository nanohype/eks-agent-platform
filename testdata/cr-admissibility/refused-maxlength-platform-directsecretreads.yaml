# A secret name one character over the cap, and matching the pattern, so length
# is the only thing between it and admission.
#
# admissibility: refused maxLength spec.identity.directSecretReads[0]
apiVersion: platform.nanohype.dev/v1alpha1
kind: Platform
metadata:
  name: corpus-long-secret
  namespace: eks-agent-platform
spec:
  tenant: corpus
  budget:
    name: corpus-long-secret-budget
  identity:
    allowedModelFamilies:
      - anthropic
    directSecretReads:
      - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
