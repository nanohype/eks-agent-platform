# bedrock-egress — the tenant egress contract for the Bedrock model plane.
#
# Publishes the reference tenant NetworkPolicy as a ConfigMap for documentation
# and auditing. The operator embeds the equivalent policy in Go and applies it
# per tenant namespace at Platform reconcile time, so nothing depends on this
# chart being installed; it exists so the contract is readable without reading
# the operator.
#
# Gateway configuration itself — region, model routes, rate limits, guardrails —
# lives on the ModelGateway CR, not here.

networkPolicy:
  enabled: true
  # default-deny on every tenant namespace, with allow rules for:
  #   - egress to the Platform's own gateway, in the same namespace
  #   - egress to the OTel collector
  #   - egress DNS
  #   - egress to the EKS Pod Identity credential endpoint (cilium only)
  tenantNamespaceLabel: "agents.nanohype.dev/tenant"
  observabilityNamespace: observability
