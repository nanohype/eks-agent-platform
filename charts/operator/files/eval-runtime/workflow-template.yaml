# eval-runner WorkflowTemplate
#
# Reference contract (consumed by operators/internal/controller/eval_reconcile.go):
#   workflowTemplateRef:
#     name: eval-runner
#   arguments.parameters:
#     - name: platform
#     - name: tenant               (tenant NAME — telemetry attribution only)
#     - name: fleet
#     - name: suite-namespace      (where the EvalSuite lives; writeback target)
#     - name: eval-reports-bucket  (supplied per run by the reconciler)
#     - name: pass-threshold       (decimal-string 0..1, e.g. "0.85")
#     - name: cases-inline  OR  cases-manifest   (mutually exclusive)
#
# Pipeline:
#   1. resolve-cases  — emit the case list as JSON to /tmp/cases.json
#      (inline branch reads from parameter directly; manifest branch
#      pulls from s3://<eval-reports>/<platform>/manifests/<name>.json)
#   2. run-cases      — iterate cases, invoke the agent under test via
#      the Platform's ModelGateway, capture latency + output. Emits
#      per-case JSON results to /tmp/results.json.
#   3. score          — compute pass rate against thresholds, render
#      HTML + junit.xml, upload artifacts to
#      s3://<eval-reports>/<platform>/runs/<suite>/<runId>/.
#   4. writeback      — patch EvalSuite.status with lastScore, lastRunAt,
#      lastReportUrl, phase (Passed/Failed).
#
# onExit: run-outcome — runs after the workflow whatever its outcome, and
#      reports a run that never reached step 4. See the handler for the ways a
#      run can stop without reaching the handler either.
#
# How a value reaches a script:
#
#   Argo resolves {{...}} by rewriting the template text before the pod exists,
#   so an expression inside a script's `source` becomes part of the program. The
#   values flowing through this pipeline include tenant-authored case inputs,
#   the EvalSuite's manifest name and model replies to adversarial cases; one
#   carrying a quote, a $( or a newline would run as shell in a pod holding the
#   eval-runner role and kubectl. So a value reaches a script as data, never as
#   source:
#
#   - a JSON document (the cases, the results, the score) is a raw input
#     artifact: Argo writes the value to the artifact's path before the script
#     starts, and the script reads the file. A raw artifact needs no artifact
#     repository; its content travels inside the template.
#   - a scalar (a name, a bucket, a URL, the threshold) is an environment
#     variable, which the script expands inside double quotes.
#
#   Documents do not travel as environment variables because Linux caps a
#   single environment string at 128 KiB at exec, and Argo Workflows does not
#   offload a container's env. It does move a template that outgrows that size
#   into a ConfigMap, so a raw artifact keeps Argo's parameter size limit.
#
#   The only expressions left in a script's source are {{workflow.uid}} and
#   {{workflow.creationTimestamp.RFC3339}}. The API server and Argo generate
#   both in a fixed format, and nothing a submitter, a tenant or a model
#   supplies reaches either. scripts/check-argo-script-splices.py fails on any
#   other expression in a script's source or in a shell's program argument.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: eval-runner
  namespace: eval-runner
spec:
  serviceAccountName: eval-runner

  # The eval-runner namespace enforces the restricted Pod Security Standard
  # (templates/eval-runtime/namespace.yaml), and PSA is a built-in admission
  # plugin with no exclusion list — so a non-compliant step pod is REJECTED, not
  # warned. Every step of this pipeline was, on every cluster:
  #
  #   pods "…-resolve-cases-…" is forbidden: violates PodSecurity
  #   "restricted:latest": allowPrivilegeEscalation != false (containers "init",
  #   "wait", "main" must set …), unrestricted capabilities …, runAsNonRoot !=
  #   true …, seccompProfile …
  #
  # Note "init" and "wait": those are the containers ARGO injects, not ours.
  # A securityContext on the step templates alone is not sufficient, and the
  # pod-level block below is what reaches them for runAsNonRoot/seccompProfile.
  # Their allowPrivilegeEscalation + capabilities are per-container and cannot
  # be set from here at all — that comes from the workflow controller's
  # `executor.securityContext` (eks-gitops addons/argo-platform/argo-workflows).
  # Both halves are required; neither alone admits the pod.
  #
  # uid 1000 is the `node` user the eval-runner image already runs as.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  arguments:
    parameters:
      - name: platform
      - name: tenant
      - name: fleet
      # suite-name is the bare EvalSuite resource name (workflow.name
      # is platform-prefixed; recovering the suite name with shell
      # parameter expansion breaks on hyphenated platform names).
      - name: suite-name
      - name: pass-threshold
      # The namespace the EvalSuite lives in — where the writeback step patches
      # its status. Distinct from `tenant`, which is a tenant NAME: patching in
      # a namespace named after the tenant addresses one that need not exist,
      # and kubectl reports success on a patch that lands nowhere useful.
      # Supplied per run by the EvalSuite reconciler.
      - name: suite-namespace
        value: "REPLACE_BY_EVALSUITE"
      - name: cases-inline
        value: ""
      - name: cases-manifest
        value: ""
      # Resolved by ApplicationSet patch per-env from
      # /eks-agent-platform/<cluster>/eval-runtime/eval_reports_bucket
      - name: eval-reports-bucket
        # Quoted so an empty substitution stays an empty string, not YAML null —
        # Argo Workflows v4.0+ rejects a null parameter value (must be a string).
        value: "REPLACE_BY_APPLICATIONSET"
      # The route contract the Platform's ModelGateway published, supplied per
      # run by the EvalSuite reconciler. Three values, not one: the gateway
      # serves each wire format under its own prefix, so the endpoint alone is
      # not a usable base for any client; the route name is what goes in the
      # request body's `model` field, which is where the gateway reads it to
      # derive x-ai-eg-model; and the wire format decides which body to build
      # and which response shape comes back.
      - name: model-route-base-url
        value: "REPLACE_BY_EVALSUITE"
      - name: model-route
        value: "REPLACE_BY_EVALSUITE"
      - name: model-route-api
        value: "REPLACE_BY_EVALSUITE"

  entrypoint: pipeline

  # What the suite reports when a run does not reach its writeback step.
  #
  # writeback is the only task that patches EvalSuite.status, and it depends on
  # score, so a run that is terminated — by the workflow deadline, by a step
  # failing, by eviction — patches nothing. The suite keeps the phase and the
  # score of the last run that DID finish, under a later schedule tick, and
  # reads as a suite that passed. Argo runs the exit handler on the workflow's
  # own outcome — including the three above — which makes it the only place that
  # sees those. The handler names the ways a run can stop without reaching it.
  onExit: run-outcome

  templates:
    # ─────────────── orchestration ───────────────
    - name: pipeline
      dag:
        tasks:
          - name: resolve
            template: resolve-cases
            arguments:
              parameters:
                - { name: cases-inline, value: "{{workflow.parameters.cases-inline}}" }
                - { name: cases-manifest, value: "{{workflow.parameters.cases-manifest}}" }
                - { name: platform, value: "{{workflow.parameters.platform}}" }
                - { name: bucket, value: "{{workflow.parameters.eval-reports-bucket}}" }
          - name: run
            template: run-cases
            depends: resolve
            arguments:
              parameters:
                - { name: cases-json, value: "{{tasks.resolve.outputs.parameters.cases}}" }
                - { name: base-url, value: "{{workflow.parameters.model-route-base-url}}" }
                - { name: route, value: "{{workflow.parameters.model-route}}" }
                - { name: route-api, value: "{{workflow.parameters.model-route-api}}" }
          - name: score
            template: score
            depends: run
            arguments:
              parameters:
                - { name: results-json, value: "{{tasks.run.outputs.parameters.results}}" }
                - { name: pass-threshold, value: "{{workflow.parameters.pass-threshold}}" }
                - { name: platform, value: "{{workflow.parameters.platform}}" }
                - { name: suite, value: "{{workflow.name}}" }
                - { name: bucket, value: "{{workflow.parameters.eval-reports-bucket}}" }
          - name: writeback
            template: writeback
            depends: score
            arguments:
              parameters:
                - { name: score-json, value: "{{tasks.score.outputs.parameters.score}}" }
                - { name: suite-name, value: "{{workflow.parameters.suite-name}}" }
                - { name: suite-namespace, value: "{{workflow.parameters.suite-namespace}}" }

    # ─────────────── 1. resolve-cases ───────────────
    # Emits the case list to outputs.parameters.cases. One of the two
    # input parameters is empty; the script picks whichever is set.
    - name: resolve-cases
      inputs:
        parameters:
          - name: cases-inline
          - name: cases-manifest
          - name: platform
          - name: bucket
        artifacts:
          # Empty when the suite loads its cases from a manifest. archive.none
          # delivers the bytes as they are: Argo otherwise probes a raw artifact
          # for a tarball and unpacks one.
          - name: inline-cases
            path: /tmp/inline-cases.json
            archive: { none: {} }
            raw:
              data: "{{inputs.parameters.cases-inline}}"
      script:
        # The eval-runner image, not amazon/aws-cli: this script pipes through
        # `jq` to compact the case list, and the aws-cli image ships no jq —
        # the step exited 127 on its first line that mattered. The eval-runner
        # image carries aws, jq and kubectl together, which is why the other
        # three steps already use it. The chart's string-replace rewrites this
        # literal, so the tag stays pinned by .Values.evalRuntime.image.
        image: ghcr.io/nanohype/eks-agent-platform/eval-runner:0.1.0
        command: ["/bin/sh", "-c"]
        # PSS restricted, per container. The pod-level block covers
        # runAsNonRoot/seccompProfile; these two are container-scoped and have no
        # pod-level equivalent. Verified against the eval-runner image: every
        # binary the steps invoke (node, aws, jq, kubectl, evaluate, score) execs
        # cleanly under --cap-drop ALL as uid 1000, so unlike CoreDNS nothing here
        # carries file capabilities that an empty bounding set would break.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: CASES_MANIFEST
            value: "{{inputs.parameters.cases-manifest}}"
          - name: PLATFORM
            value: "{{inputs.parameters.platform}}"
          - name: REPORTS_BUCKET
            value: "{{inputs.parameters.bucket}}"
        source: |
          set -eu
          if [ -s /tmp/inline-cases.json ] && [ "$(cat /tmp/inline-cases.json)" != "[]" ]; then
            cp /tmp/inline-cases.json /tmp/cases.json
          elif [ -n "$CASES_MANIFEST" ]; then
            # CASES_MANIFEST is an s3:// URI or a bare key under
            # <platform>/manifests/<name>.json
            case "$CASES_MANIFEST" in
              s3://*) aws s3 cp "$CASES_MANIFEST" /tmp/cases.json ;;
              *)      aws s3 cp "s3://$REPORTS_BUCKET/$PLATFORM/manifests/$CASES_MANIFEST" /tmp/cases.json ;;
            esac
          else
            echo "no cases supplied (inline empty + manifest empty)" >&2
            exit 1
          fi
          # Compact so the outputs.parameter doesn't blow past the 256KiB
          # Argo parameter-value cap on big suites.
          jq -c '.' /tmp/cases.json > /tmp/cases.compact.json
          mv /tmp/cases.compact.json /tmp/cases.json
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 256Mi }
      outputs:
        parameters:
          - name: cases
            valueFrom: { path: /tmp/cases.json }

    # ─────────────── 2. run-cases ───────────────
    # For each case: POST to the gateway's HTTP endpoint with the input
    # prompt, capture the response + latency. Emits results.json with one
    # record per case.
    - name: run-cases
      inputs:
        parameters:
          - name: cases-json
          - name: base-url
          - name: route
          - name: route-api
        artifacts:
          - name: cases
            path: /tmp/cases.json
            archive: { none: {} }
            raw:
              data: "{{inputs.parameters.cases-json}}"
      script:
        image: ghcr.io/nanohype/eks-agent-platform/eval-runner:0.1.0
        command: ["/bin/sh", "-c"]
        # PSS restricted, per container. The pod-level block covers
        # runAsNonRoot/seccompProfile; these two are container-scoped and have no
        # pod-level equivalent. Verified against the eval-runner image: every
        # binary the steps invoke (node, aws, jq, kubectl, evaluate, score) execs
        # cleanly under --cap-drop ALL as uid 1000, so unlike CoreDNS nothing here
        # carries file capabilities that an empty bounding set would break.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        # run-cases is the AI workload of the pipeline — it invokes the agent
        # under test. The value is the platform-tenant-contract's resource
        # attributes, in the env var an OpenTelemetry SDK reads them from.
        #
        # No SDK reads it here: packages/eval-runner declares no OpenTelemetry
        # dependency and the step sets no auto-instrumentation, so this step
        # exports nothing and is deliberately given no OTLP endpoint — an
        # endpoint for an exporter that does not exist would describe a pipeline
        # rather than build one. What the attribute carries is the attribution
        # any instrumentation added to this image inherits without a second
        # place to wire the tenant identity.
        env:
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "agents.tenant={{workflow.parameters.tenant}},agents.platform={{workflow.parameters.platform}},agents.fleet={{workflow.parameters.fleet}}"
          - name: MODEL_ROUTE_BASE_URL
            value: "{{inputs.parameters.base-url}}"
          - name: MODEL_ROUTE
            value: "{{inputs.parameters.route}}"
          - name: MODEL_ROUTE_API
            value: "{{inputs.parameters.route-api}}"
        source: |
          set -eu
          # eval-runner is the @eks-agent/eval-runner Node CLI (packages/
          # eval-runner). The 'evaluate' command reads /tmp/cases.json and POSTs
          # each case to the route's published base URL — {base-url}/v1/messages
          # for an Anthropic route, {base-url}/chat/completions for an OpenAI
          # one — with the ROUTE NAME in the body's `model` field, which is where
          # the gateway reads it to derive x-ai-eg-model. It prices the call and
          # writes /tmp/results.json — one record per case:
          #   {name, input, output, latency_ms, cost_usd, error?}
          # plus the case's echoed assertion criteria (expectContains,
          # expectNotContains, expectRefusal, maxLatencyMs, maxCostUsd) so the
          # score step can grade without re-reading the source suite.
          evaluate \
            --cases /tmp/cases.json \
            --base-url "$MODEL_ROUTE_BASE_URL" \
            --route "$MODEL_ROUTE" \
            --route-api "$MODEL_ROUTE_API" \
            --output /tmp/results.json
        resources:
          requests: { cpu: 500m, memory: 512Mi }
          limits: { cpu: 2000m, memory: 2Gi }
      outputs:
        parameters:
          - name: results
            valueFrom: { path: /tmp/results.json }

    # ─────────────── 3. score ───────────────
    # Compute the mean score + per-case pass/fail against every assertion the
    # case declares (expectContains, expectNotContains, expectRefusal,
    # maxLatencyMs, maxCostUsd — an unpriced model fails a cost ceiling closed).
    # Render the HTML report + junit.xml and upload to S3.
    - name: score
      inputs:
        parameters:
          - name: results-json
          - name: pass-threshold
          - name: platform
          - name: suite
          - name: bucket
        artifacts:
          # The results carry the model's replies, adversarial cases included.
          - name: results
            path: /tmp/results.json
            archive: { none: {} }
            raw:
              data: "{{inputs.parameters.results-json}}"
      script:
        image: ghcr.io/nanohype/eks-agent-platform/eval-runner:0.1.0
        command: ["/bin/sh", "-c"]
        # PSS restricted, per container. The pod-level block covers
        # runAsNonRoot/seccompProfile; these two are container-scoped and have no
        # pod-level equivalent. Verified against the eval-runner image: every
        # binary the steps invoke (node, aws, jq, kubectl, evaluate, score) execs
        # cleanly under --cap-drop ALL as uid 1000, so unlike CoreDNS nothing here
        # carries file capabilities that an empty bounding set would break.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: PASS_THRESHOLD
            value: "{{inputs.parameters.pass-threshold}}"
          - name: PLATFORM
            value: "{{inputs.parameters.platform}}"
          - name: SUITE
            value: "{{inputs.parameters.suite}}"
          - name: REPORTS_BUCKET
            value: "{{inputs.parameters.bucket}}"
        source: |
          set -eu
          # The uniquifier is the workflow's own UID, not $RANDOM. /bin/sh in
          # this image is dash, which has no $RANDOM, and `set -u` makes that a
          # fatal error on the line itself:
          #     /argo/staging/script: 3: RANDOM: parameter not set
          # So this step exited 2 before scoring anything, on every run, on every
          # cluster — while report.html and junit.xml were never written and
          # writeback was Omitted for an unmet dependency. workflow.uid is unique
          # per run by construction and needs no shell feature at all.
          run_id="$(date -u +%Y%m%dT%H%M%SZ)-{{workflow.uid}}"
          score \
            --results /tmp/results.json \
            --pass-threshold "$PASS_THRESHOLD" \
            --report /tmp/report.html \
            --junit /tmp/junit.xml \
            --score-out /tmp/score.json
          run_prefix="s3://$REPORTS_BUCKET/$PLATFORM/runs/$SUITE/$run_id"
          aws s3 cp /tmp/report.html "$run_prefix/report.html"
          aws s3 cp /tmp/junit.xml   "$run_prefix/junit.xml"
          # Inject the report URL into score.json so writeback can copy
          # it into EvalSuite.status.lastReportUrl.
          jq --arg url "$run_prefix/report.html" \
             '. + {reportUrl: $url}' /tmp/score.json > /tmp/score.with-url.json
          mv /tmp/score.with-url.json /tmp/score.json
        resources:
          requests: { cpu: 200m, memory: 256Mi }
          limits: { cpu: 1000m, memory: 1Gi }
      outputs:
        parameters:
          - name: score
            valueFrom: { path: /tmp/score.json }
        # No outputs.artifacts. Declaring one makes Argo push the file to the
        # controller's configured artifact repository, and there is none on
        # dev or staging — the step fails after the run, on a file it has
        # already delivered. The script above uploads report.html and junit.xml
        # to s3://<eval-reports>/<platform>/runs/<suite>/<runId>/ itself, which
        # is the prefix the eval-runner role is granted and the one
        # status.lastReportUrl points at. An artifact declaration here would
        # be a second, differently-permissioned copy of a delivery that has
        # already happened.

    # ─────────────── exit handler ───────────────
    # Reports a run that did not reach writeback. Runs on the workflow's own
    # outcome — deadline expiry, a step failing, eviction — and NOT on every
    # way a run can stop: Argo skips exit handlers under the Terminate shutdown
    # strategy (`argo terminate`, and `activeDeadlineSeconds: 0` set on a running
    # workflow), a deleted Workflow runs nothing, and this handler is a single
    # pod with no retryStrategy, so its own failure leaves the suite reporting
    # the last run that finished.
    - name: run-outcome
      inputs:
        parameters:
          - name: workflow-status
            value: "{{workflow.status}}"
          - name: suite-name
            value: "{{workflow.parameters.suite-name}}"
          - name: suite-namespace
            value: "{{workflow.parameters.suite-namespace}}"
      script:
        image: ghcr.io/nanohype/eks-agent-platform/eval-runner:0.1.0
        command: ["/bin/sh", "-c"]
        # PSS restricted, per container. The pod-level block covers
        # runAsNonRoot/seccompProfile; these two are container-scoped and have no
        # pod-level equivalent. Verified against the eval-runner image: every
        # binary the steps invoke (node, aws, jq, kubectl, evaluate, score) execs
        # cleanly under --cap-drop ALL as uid 1000, so unlike CoreDNS nothing here
        # carries file capabilities that an empty bounding set would break.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: WORKFLOW_STATUS
            value: "{{inputs.parameters.workflow-status}}"
          - name: SUITE_NAME
            value: "{{inputs.parameters.suite-name}}"
          - name: SUITE_NAMESPACE
            value: "{{inputs.parameters.suite-namespace}}"
        source: |
          set -eu
          # A run that succeeded wrote its own result at step 4; a second patch
          # behind it would replace that result with a blank one.
          if [ "$WORKFLOW_STATUS" = "Succeeded" ]; then
            exit 0
          fi
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          started='{{workflow.creationTimestamp.RFC3339}}'

          # Whether writeback ran is not the same question as how the workflow
          # ended. Its patch is issued from the main container, so a node can
          # still end Failed or Error after the patch has landed — a wait
          # container failing, a pod evicted once the write was through. Blanking
          # on the workflow's phase alone would then discard a score that was
          # measured.
          #
          # status.lastRunAt is stamped by whoever wrote last, and both stamps
          # are UTC in the same layout, so a lexicographic compare orders them.
          # A lastRunAt after this workflow started is writeback's, from this run.
          wrote="$(kubectl get evalsuite "$SUITE_NAME" \
            --namespace "$SUITE_NAMESPACE" \
            -o jsonpath='{.status.lastRunAt}' 2>/dev/null || true)"
          newest="$(printf '%s\n%s\n' "$started" "$wrote" | sort | tail -1)"

          if [ -n "$wrote" ] && [ "$newest" = "$wrote" ] && [ "$wrote" != "$started" ]; then
            # Measured, then the run ended badly: correct the phase, keep the
            # numbers the run actually produced.
            patch="$(jq -nc '{status:{phase:"Failed"}}')"
          else
            # Nothing was measured. Clearing lastScore and lastReportUrl is the
            # point: leaving the previous run's score beside this run's timestamp
            # attributes a number to a run that never produced one.
            patch="$(jq -nc --arg t "$now" '{status:{phase:"Failed",lastRunAt:$t,lastScore:"",lastReportUrl:""}}')"
          fi

          kubectl patch evalsuite "$SUITE_NAME" \
            --namespace "$SUITE_NAMESPACE" \
            --subresource status \
            --type merge \
            --patch "$patch"
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 256Mi }

    # ─────────────── 4. writeback ───────────────
    # PATCH EvalSuite.status with the computed mean score + phase. Uses
    # kubectl which is in the eval-runner image and the SA's RBAC permits
    # patching evalsuites/status.
    - name: writeback
      inputs:
        parameters:
          - name: score-json
          - name: suite-name
          - name: suite-namespace
        artifacts:
          - name: score
            path: /tmp/score.json
            archive: { none: {} }
            raw:
              data: "{{inputs.parameters.score-json}}"
      script:
        image: ghcr.io/nanohype/eks-agent-platform/eval-runner:0.1.0
        command: ["/bin/sh", "-c"]
        # PSS restricted, per container. The pod-level block covers
        # runAsNonRoot/seccompProfile; these two are container-scoped and have no
        # pod-level equivalent. Verified against the eval-runner image: every
        # binary the steps invoke (node, aws, jq, kubectl, evaluate, score) execs
        # cleanly under --cap-drop ALL as uid 1000, so unlike CoreDNS nothing here
        # carries file capabilities that an empty bounding set would break.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: SUITE_NAME
            value: "{{inputs.parameters.suite-name}}"
          - name: SUITE_NAMESPACE
            value: "{{inputs.parameters.suite-namespace}}"
        source: |
          set -eu
          # /tmp/score.json shape (one line):
          #   {"meanScore":"0.92","passed":true,"reportUrl":"s3://…"}
          mean="$(jq -r '.meanScore' /tmp/score.json)"
          phase="$(jq -r 'if .passed then "Passed" else "Failed" end' /tmp/score.json)"
          url="$(jq -r '.reportUrl' /tmp/score.json)"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # suite-name is the bare EvalSuite resource name; passed in by
          # the operator directly so we don't have to reconstruct it
          # from workflow.name (platform-prefixed; shell-strip breaks
          # on hyphenated platform names like 'acme-corp').
          kubectl patch evalsuite "$SUITE_NAME" \
            --namespace "$SUITE_NAMESPACE" \
            --subresource status \
            --type merge \
            --patch "$(jq -nc --arg ls "$mean" --arg lu "$url" --arg t "$now" --arg p "$phase" '{status:{lastScore:$ls,lastReportUrl:$lu,lastRunAt:$t,phase:$p}}')"
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 256Mi }
