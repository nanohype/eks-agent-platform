# Default values for the eks-agent-platform operator chart.

replicaCount: 2

image:
  repository: ghcr.io/nanohype/eks-agent-platform/operator
  tag: "" # defaults to .Chart.AppVersion if empty
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: operator
  annotations: {} # eks.amazonaws.com/role-arn injected per-env

leaderElection:
  enabled: true
  id: eks-agent-platform.nanohype.dev

# Extra args appended verbatim to the operator container's command line.
# Useful for local-dev (`--disable-aws`), debug flags, or env-specific
# overrides not captured by the structured config block above. Each
# entry is rendered as-is into args:.
extraArgs: []

reconcilers:
  tenant:
    concurrent: 1
    requeueInterval: 5m
  platform:
    concurrent: 3
  gateway:
    concurrent: 3
  runtime:
    concurrent: 5
  sandbox:
    concurrent: 3
  agentsandbox:
    concurrent: 5
  budget:
    concurrent: 1
    requeueInterval: 1h
  slo:
    concurrent: 2
    # Must not exceed the shortest burn-rate window (5m) or a fast burn is
    # stepped over between ticks.
    requeueInterval: 5m
    # How many requeueIntervals an engaged rollout hold may go unobserved on the
    # tenant's AppProject before the reconciler reports it as not landing.
    holdGraceIntervals: 2
  eval:
    concurrent: 2

config:
  environment: ""
  # Full EKS cluster name this operator serves (e.g. development-analytics). Keys the
  # per-cluster SSM subtree /eks-agent-platform/<clusterName>/ and prefixes every
  # role the operator mints for a Platform, isolating co-located sibling
  # clusters. Required — set per cluster at install time. values.schema.json
  # caps its length at what keeps every role name it prefixes within IAM's
  # 64-character limit; the operator refuses a longer one at startup, unless run
  # with --disable-aws, which mints no role.
  clusterName: ""
  region: us-west-2
  # Org-dimension tag values stamped on the tenant IAM roles the operator
  # creates (resource-tagging standard, required tier). Empty falls back to the
  # operator's defaults (platform-engineering / engineering / internal / soc2);
  # override per-env via values-<env>.yaml (e.g. dataClassification: confidential
  # in production).
  tags:
    costCenter: ""
    businessUnit: ""
    dataClassification: ""
    compliance: ""

# There are deliberately no kill-switch, bedrock or cost keys here.
#
# The operator resolves those at startup from SSM, in one recursive
# GetParametersByPath sweep of /eks-agent-platform/<clusterName>/ — the event bus, the
# baseline guardrail, the Athena workgroup, database and CUR table all arrive that way,
# published by the terraform component that owns each one. A Helm value for any of them
# would be a second place the same thing is decided, and the chart's copy would lose:
# nothing reads it.
#
# What belongs here is what Helm genuinely decides — the identity of the cluster this
# operator serves, and the org-dimension tags it stamps on the roles it mints.

metrics:
  enabled: true
  port: 8080
  # Serve metrics over HTTPS and require every scrape to authenticate +
  # authorize (controller-runtime's WithAuthenticationAndAuthorization filter:
  # TokenReview + a SubjectAccessReview on the /metrics nonResourceURL). This
  # closes the info-disclosure gap where the NetworkPolicy was the only gate.
  # The chart then wires the operator SA for token review (system:auth-delegator)
  # and, for the ServiceMonitor path, a metrics-reader SA + token the scraper
  # presents (see rbac.yaml, servicemonitor.yaml).
  #
  # A scraper MUST present a bearer token over https to read the endpoint. An
  # unauthenticated annotation-based scrape can no longer read it, so the
  # plaintext prometheus.io scrape annotations below are suppressed while secure.
  # Set false only where no kube-apiserver is reachable to review tokens.
  secure: true
  service:
    type: ClusterIP
  serviceMonitor:
    enabled: true
  # Pod-level prometheus.io scrape annotations for annotation-based scrapers
  # (e.g. the Grafana Agent → Amazon Managed Prometheus, which runs without a
  # prometheus-operator so it does not consume the ServiceMonitor). These are
  # only emitted when metrics.secure is false — an annotation scrape is
  # plaintext and unauthenticated, which the secure endpoint rejects; a secure
  # deployment is scraped via the authenticated ServiceMonitor (kube-prometheus-
  # stack) or by an agent taught to present the metrics-reader token over https.
  # The operator NetworkPolicy allows scrape from the monitoring namespace.
  podScrapeAnnotations: true

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

nodeSelector: {}
tolerations: []
affinity: {}

priorityClassName: system-cluster-critical

networkPolicy:
  enabled: true
  # Policy engine. `cilium` emits a CiliumNetworkPolicy that allows egress to
  # the kube-apiserver via its reserved identity — the only way to express
  # that under cilium, which is the CNI on every cluster this operator runs
  # on (kx + EKS). `kubernetes` emits a vanilla NetworkPolicy for non-cilium
  # clusters (its kube-apiserver egress rule does NOT work under cilium).
  engine: cilium
  # CIDR of the kube-apiserver service. Only used by the `kubernetes` engine.
  # EKS default is 172.20.0.1/32; legacy or self-managed clusters may use a
  # different service IP (e.g. 10.100.0.1/32). Override per-environment.
  kubernetesServiceCIDR: "172.20.0.1/32"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ── vcluster hard-isolation tier ─────────────────────────────────────────────
# Config for Platform.spec.isolation: vcluster. The operator declares a
# per-Platform virtual cluster as an ArgoCD Application pinned to chart.version,
# and bootstraps the fleet's autoscaler (KEDA) INSIDE each vcluster via the
# chart's init-charts, so the tenant's control+data plane live entirely within
# the isolation boundary. The agents themselves need no init-chart: they are
# plain Deployments, which every cluster already serves. ArgoCD is a hard prerequisite for
# this tier (see docs/adr/0008-vcluster-isolation-tier.md); the namespace tier
# ignores this block entirely.
vcluster:
  chart:
    # The upstream vcluster chart. OCI mirror: oci://ghcr.io/loft-sh/charts/vcluster.
    repoURL: https://charts.loft.sh
    # Pinned chart version (targetRevision). Renovate proposes bumps; a human
    # reviews majors — the operator never auto-upgrades a running vcluster.
    #
    # scripts/check-vcluster-chart.py gates this pin: it renders the values the
    # operator actually emits against this chart and diffs the resulting object
    # set, so a bump that renames a values path fails, and one that silently
    # drops an object fails too.
    version: "0.36.1"
  # initCharts are deployed inside every per-Platform vcluster on startup
  # (experimental.deploy.vcluster.helm) — the placement for anything a fleet
  # needs that the virtual cluster does not ship with. KEDA is the only one:
  # without it a fleet still runs, at its static replica count. Set to [] for a
  # containment-only vcluster. Field names are the operator flag's JSON contract
  # (chartName/repoURL/version/releaseName/namespace/values).
  initCharts:
    - chartName: keda
      repoURL: https://kedacore.github.io/charts
      version: "2.20.2"
      releaseName: keda
      namespace: keda

# ── eval-runtime ─────────────────────────────────────────────────────────────
# The Argo Workflows runtime the operator submits EvalSuite runs to: a
# WorkflowTemplate (eval-runner), the gating AnalysisTemplate, and the RBAC the
# workflow pods run with. Ships with the operator so the product owns its own
# runtime; eks-gitops deploys the chart.
#
# The chart creates no ServiceAccount for the runs. Each run holds its Platform's
# own eval identity — a ServiceAccount the operator creates in this namespace,
# bound by EKS Pod Identity to a role scoped to that Platform's prefixes in the
# eval-reports bucket — so no role ARN or account name is configured here.
#
# Requires the Argo Workflows CRD on the cluster (eks-gitops addons-argo-platform).
evalRuntime:
  enabled: true
  # Create the eval-runner namespace. Disable if it is provisioned elsewhere.
  createNamespace: true
  # Must equal the runner_namespace terraform/components/eval-runtime publishes
  # to SSM: the operator submits runs and creates each Platform's eval
  # ServiceAccount in the namespace it reads there, and this chart installs the
  # WorkflowTemplate and the run RBAC in this one.
  namespace: eval-runner
  # S3 bucket the eval workflow writes reports to (terraform eval-runtime output).
  # Injected per-cluster; empty in the base chart.
  evalReportsBucket: ""
  # The eval-runner image the WorkflowTemplate's steps run.
  # templates/eval-runtime/workflowtemplate.yaml rewrites each eval-runner image
  # literal in files/eval-runtime/workflow-template.yaml to this repository and
  # tag. .github/workflows/release.yaml builds, cosign-signs and SBOM-attests the
  # image from an eval-runner-v<version> tag and from nothing else, so the tag
  # here names a release, never a floating :latest. Move it after that release
  # publishes: pull-request CI reads image references offline, and
  # scripts/check-image-refs.py resolves them against GHCR from
  # .github/workflows/image-refs-registry.yaml on each push to main and weekly.
  image:
    repository: ghcr.io/nanohype/eks-agent-platform/eval-runner
    tag: "0.1.1"
  rollouts:
    # The Argo Rollouts AnalysisTemplate (eval-suite-gate). Off by default: it
    # needs the Argo Rollouts CRD, which is not guaranteed on every cluster.
    enabled: false

