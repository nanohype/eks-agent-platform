{{- if .Values.evalRuntime.enabled }}
{{- /*
  The Kubernetes half of an eval run's identity. Every run holds its Platform's
  own ServiceAccount, eval-<platform>, which the operator creates in the eval
  runtime namespace alongside the Platform's eval IAM role; this chart creates
  no ServiceAccount of its own. Both bindings name the namespace's
  ServiceAccount group, so they cover each Platform's account as the operator
  mints it. Nothing else runs in the eval runtime namespace: the operator
  submits eval Workflows there and tenants deploy nothing into it.

  The grants are what a run's steps call and nothing more. resolve-cases, run
  and score make no Kubernetes call. writeback and the exit handler read the
  suite (`kubectl get evalsuite`) and patch its status subresource. Argo's
  executor reports each step's outputs as a WorkflowTaskResult in the
  Workflow's own namespace. No run creates a Workflow: that is the operator's
  job, and a run able to submit one could name another Platform's account.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "operator.fullname" . }}-eval-runner
  labels:
    {{- include "operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: eval-runtime
rules:
  - apiGroups: ["governance.nanohype.dev"]
    resources: ["evalsuites"]
    verbs: ["get"]
  - apiGroups: ["governance.nanohype.dev"]
    resources: ["evalsuites/status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "operator.fullname" . }}-eval-runner
  labels:
    {{- include "operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: eval-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "operator.fullname" . }}-eval-runner
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:{{ .Values.evalRuntime.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "operator.fullname" . }}-eval-executor
  namespace: {{ .Values.evalRuntime.namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: eval-runtime
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "operator.fullname" . }}-eval-executor
  namespace: {{ .Values.evalRuntime.namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: eval-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "operator.fullname" . }}-eval-executor
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:{{ .Values.evalRuntime.namespace }}
{{- end }}
