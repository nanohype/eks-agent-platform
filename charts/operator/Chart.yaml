apiVersion: v2
name: operator
description: eks-agent-platform — Kubernetes operator (CRDs + Deployment + RBAC).
type: application
# appVersion names the operator release this chart runs, and the chart ships
# only what that release honours. Every eval WorkflowTemplate parameter left to
# the reconciler is one the reconciler at operator-v<appVersion> supplies, and
# every parameter that reconciler sends is one the template declares. The CRDs
# generated at that tag are the ones crds/ installs, with the same fields and
# the same status descriptions, because a status description is the binary's
# account of what it writes. scripts/check-runtime-contract.py checks the
# parameters on every pull request, and all of it with --release before the
# charts-oci release job publishes the chart; a chart that fails it stays
# unpublished until appVersion names a release that passes.
#
# version moves with any change to packaged content, because a published
# version is never overwritten: scripts/check-chart-version-bump.py fails a
# pull request that changes packaged content under an unchanged version, and
# the release job refuses to push different bytes under a published one.
version: 0.7.5
appVersion: "0.7.2"
# `-0` admits pre-release-tagged versions so the constraint matches managed
# distros that append a suffix (EKS reports e.g. v1.35.4-eks-40737a8).
kubeVersion: ">=1.32.0-0"
home: https://github.com/nanohype/eks-agent-platform
sources:
  - https://github.com/nanohype/eks-agent-platform
maintainers:
  - name: stxkxs
    email: rackctl@gmail.com
keywords:
  - bedrock
  - gateway
  - agents
  - dra
  - operator
  - eval
  - slo
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
