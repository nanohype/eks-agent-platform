apiVersion: v2
name: operator
description: eks-agent-platform — Kubernetes operator (CRDs + Deployment + RBAC).
type: application
# appVersion tracks the operator binary's EKS Pod Identity tenant-runtime model
# (assumeRolePolicyForPodIdentity + PodIdentityAssociation; ClusterName replaces the
# OIDC provider/issuer inputs). The chart folds the eval-runtime (Argo
# WorkflowTemplate/AnalysisTemplate) behind evalRuntime.*. It ships no SLO
# manifests — see 0.6.0 below, which removed them.
#
# 0.6.8 is documentation only. The CRD's `isolation` description cites an ADR by
# path, and the ADR sequence closed up, so the packaged CRD carries different
# bytes for the same schema — no field, type, default or validation marker
# moves. README.md's install example also pinned `--version 0.2.0`, four minor
# versions behind two lockstep bumps, so a reader following it installed a chart
# whose SLOPolicy CRD lacks `sli.errorSelector` and whose eval WorkflowTemplate
# takes one route parameter instead of three.
#
# 0.6.5 is documentation only. The README described an `slo.*` values block that
# 0.6.0 had removed and that values.schema.json now rejects outright, so a reader
# following it got `additional properties 'slo' not allowed` rather than the
# alerting it promised. Chart.yaml's own description asserted the same thing
# three lines above the entry recording the removal. No template, CRD or default
# changed; the version moves because README.md is packaged content and the
# published 0.6.4 would otherwise be overwritten with different bytes.
#
# 0.6.4 carries values.schema.json and the README's Pod Identity correction.
# Both landed while Chart.yaml still said 0.6.3, which was already published —
# so for the whole time in between, the schema existed in source and in no
# artifact, and every cluster resolving the 0.6.3 pin got a chart that had none.
# The release job compares published bytes against source and would have refused
# the next charts-v tag on it. scripts/check-chart-version-bump.py now asks the
# same question at the merge boundary, where the answer can still prevent it.
#
# 0.6.3 is a lockstep bump for the same reason 0.5.0 was, one layer out. The
# eval WorkflowTemplate's route contract is three parameters
# (model-route-base-url / model-route / model-route-api) where it was one
# (gateway-url), and only a 0.6.0 binary supplies them. 0.6.2 shipped that
# template still naming appVersion 0.5.0, and the pairing fails quietly: the
# three parameters carry REPLACE_BY_EVALSUITE defaults, so an older reconciler
# does not crash the workflow, it lets the run POST to that literal string and
# score every case zero. scripts/check-runtime-contract.py now asserts this
# pairing so the next one cannot merge.
#
# 0.6.0 removes the prometheus-operator alerting path — the PrometheusRule, the
# AlertmanagerConfig and the namespace that held them. The chart version moves
# and appVersion does not: no Go changed, so the 0.5.0 image is still exactly
# what this chart should run.
#
# 0.5.0 was a lockstep bump, and it had to be: the SLOPolicy CRD gained
# sli.errorSelector and its onPageTierBreach default moved to None. An older
# binary has no such field on its Go struct, so an errorSelector would be
# dropped on decode and the objective would silently fall back to the
# two-counter shape. A chart may not ship a CRD field its appVersion cannot
# honour — nor, as 0.6.3 records, a workflow parameter.
version: 0.6.14
appVersion: "0.6.1"
# `-0` admits pre-release-tagged versions so the constraint matches managed
# distros that append a suffix (EKS reports e.g. v1.35.4-eks-40737a8).
kubeVersion: ">=1.32.0-0"
home: https://github.com/nanohype/eks-agent-platform
sources:
  - https://github.com/nanohype/eks-agent-platform
maintainers:
  - name: stxkxs
    email: rackctl@gmail.com
keywords:
  - bedrock
  - gateway
  - agents
  - dra
  - operator
  - eval
  - slo
annotations:
