apiVersion: v2
name: operator
description: eks-agent-platform — Kubernetes operator (CRDs + Deployment + RBAC).
type: application
# appVersion tracks the operator binary's EKS Pod Identity tenant-runtime model
# (assumeRolePolicyForPodIdentity + PodIdentityAssociation; ClusterName replaces the
# OIDC provider/issuer inputs). The chart folds the eval-runtime (Argo
# WorkflowTemplate/AnalysisTemplate) behind evalRuntime.*. It ships no SLO
# manifests — see 0.6.0 below, which removed them.
#
# 0.7.4 documents, in the ModelGateway CRD, that Ready and DataPlaneProgrammed
# also wait on every Ready, non-terminating Envoy pod of the Gateway carrying a
# ready ai-gateway-extproc container, and the NoReadyEnvoyPod,
# ExtProcNotInjected and ExtProcNotReady reasons that hold it. Envoy AI Gateway
# injects that sidecar only at pod creation and admits the first pod of every
# new Gateway without it, which Envoy Gateway still reports Programmed while it
# answers every model request with HTTP 500. The schema and RBAC are unchanged
# (the operator already reads pods), and the chart could not move without its
# version (scripts/check-chart-version-bump.py), so 0.7.4 is a lockstep version
# in the sense 0.7.0 records, held for behaviour rather than a field: appVersion
# still names operator 0.7.1, which reads only Programmed. The release job's
# runtime-contract check now compares every description under `status` as well
# as the fields, since a status description is the binary's account of what it
# writes, and it holds this chart until appVersion names an operator release
# whose generated ModelGateway CRD describes the same status — the release that
# applies the gate. That supersedes "Descriptions ... are not compared" under
# 0.7.0 for status; spec descriptions are still not compared.
#
# 0.7.3 names operator 0.7.1, the release cut from the commit that writes
# status.gatewayPodIdentity and DataPlaneProgrammed (operator-v0.7.1 at
# 02203d4). Nothing else changes. 0.7.2 named operator 0.7.0, which has no such
# field, a pairing the release job's runtime-contract check refuses, so 0.7.2
# has no published chart; everything it describes below ships as 0.7.3.
#
# 0.7.2 adds status.gatewayPodIdentity to the Platform CRD and documents the
# ModelGateway's DataPlaneProgrammed condition and Provisioning phase. The
# operator that writes them gives each ModelGateway's Envoy its own
# ServiceAccount, <platform>-gateway, which Envoy Gateway creates and owns, and
# binds it to the tenant role with a second Pod Identity association recorded in
# that field; it renders no gateway until the binding is published, and reports
# a ModelGateway Ready only once Envoy Gateway reports its Gateway Programmed.
# An operator pinning the proxy to tenant-runtime gets no data plane from Envoy
# Gateway 1.10 in GatewayNamespace mode, which refuses a ServiceAccount it did
# not create.
#
# Upgrading from an operator that pinned the proxy to tenant-runtime: Envoy
# Gateway 1.8 adopted that account unconditionally (1.10 does when it carries
# Envoy Gateway's labels, as a hand-applied workaround leaves it), stamping its
# labels, an owner reference to the Gateway and automount off onto it. Either
# would let Envoy Gateway or the garbage collector delete tenant-runtime once
# the proxy moves to <platform>-gateway or the Gateway is deleted. The operator
# strips all three before it renders the move — the ModelGateway sits in
# Pending for one requeue while it does — and again before it deletes a
# Gateway, so no manual step is needed; `kubectl get sa tenant-runtime -n
# tenants-<platform> -o yaml` afterwards shows no envoy-gateway label and no
# Gateway owner reference. Like 0.7.0, this is a lockstep version: appVersion still names
# 0.7.0, which has no such field, so the release job's runtime-contract check
# holds the chart until appVersion names the operator release that carries it.
#
# 0.7.1 names the operator release that mints per-Platform eval identities,
# appVersion 0.7.0, and runs the eval steps on eval-runner 0.1.2, whose image
# carries kubectl v1.36.6. 0.7.0 named operator 0.6.2, a pairing the release
# job's runtime-contract check refuses, so 0.7.0 has no published chart.
#
# 0.7.0 gives every Platform its own eval identity. The chart creates no
# ServiceAccount for eval runs and takes no evalRuntime.serviceAccount value
# (values.schema.json rejects one); the WorkflowTemplate names no ServiceAccount;
# and the run RBAC binds the eval runtime namespace's ServiceAccount group,
# narrowed to what a run calls. The operator creates each Platform's
# eval-<platform> ServiceAccount and the <cluster>-<platform>-eval role behind
# it, and submits every run under that account. The Platform CRD gains
# status.evalRoleArn and status.evalNamespace, where that operator records each
# Platform's eval role and the namespace its account is bound in, for its
# finalizer to read. So 0.7.0 is a lockstep version in the sense 0.5.0
# records: an operator without per-Platform eval identities submits runs under
# an account this chart does not create, and each run fails before its first
# step. The chart is published only once appVersion names an operator release
# that mints them. The charts-oci release job runs
# scripts/check-runtime-contract.py --release before it pushes this chart, and
# holds the chart while the CRDs it installs and the CRDs generated at the
# operator-v<appVersion> tag differ in a field, a version or a kind they
# declare. Descriptions, defaults and validation are not compared.
# status.evalRoleArn and status.evalNamespace are the fields that tell a
# release minting eval identities apart.
#
# 0.6.8 is documentation only. The CRD's `isolation` description cites an ADR by
# path, and the ADR sequence closed up, so the packaged CRD carries different
# bytes for the same schema — no field, type, default or validation marker
# moves. README.md's install example also pinned `--version 0.2.0`, four minor
# versions behind two lockstep bumps, so a reader following it installed a chart
# whose SLOPolicy CRD lacks `sli.errorSelector` and whose eval WorkflowTemplate
# takes one route parameter instead of three.
#
# 0.6.5 is documentation only. The README described an `slo.*` values block that
# 0.6.0 had removed and that values.schema.json now rejects outright, so a reader
# following it got `additional properties 'slo' not allowed` rather than the
# alerting it promised. Chart.yaml's own description asserted the same thing
# three lines above the entry recording the removal. No template, CRD or default
# changed; the version moves because README.md is packaged content and the
# published 0.6.4 would otherwise be overwritten with different bytes.
#
# 0.6.4 carries values.schema.json and the README's Pod Identity correction.
# Both landed while Chart.yaml still said 0.6.3, which was already published —
# so for the whole time in between, the schema existed in source and in no
# artifact, and every cluster resolving the 0.6.3 pin got a chart that had none.
# The release job compares published bytes against source and would have refused
# the next charts-v tag on it. scripts/check-chart-version-bump.py now asks the
# same question at the merge boundary, where the answer can still prevent it.
#
# 0.6.3 is a lockstep bump for the same reason 0.5.0 was, one layer out. The
# eval WorkflowTemplate's route contract is three parameters
# (model-route-base-url / model-route / model-route-api) where it was one
# (gateway-url), and only a 0.6.0 binary supplies them. 0.6.2 shipped that
# template still naming appVersion 0.5.0, and the pairing fails quietly: the
# three parameters carry REPLACE_BY_EVALSUITE defaults, so an older reconciler
# does not crash the workflow, it lets the run POST to that literal string and
# score every case zero. scripts/check-runtime-contract.py now asserts this
# pairing so the next one cannot merge.
#
# 0.6.0 removes the prometheus-operator alerting path — the PrometheusRule, the
# AlertmanagerConfig and the namespace that held them. The chart version moves
# and appVersion does not: no Go changed, so the 0.5.0 image is still exactly
# what this chart should run.
#
# 0.5.0 was a lockstep bump, and it had to be: the SLOPolicy CRD gained
# sli.errorSelector and its onPageTierBreach default moved to None. An older
# binary has no such field on its Go struct, so an errorSelector would be
# dropped on decode and the objective would silently fall back to the
# two-counter shape. A chart may not ship a CRD field its appVersion cannot
# honour — nor, as 0.6.3 records, a workflow parameter. The charts-oci release
# job enforces both with scripts/check-runtime-contract.py --release.
version: 0.7.4
appVersion: "0.7.1"
# `-0` admits pre-release-tagged versions so the constraint matches managed
# distros that append a suffix (EKS reports e.g. v1.35.4-eks-40737a8).
kubeVersion: ">=1.32.0-0"
home: https://github.com/nanohype/eks-agent-platform
sources:
  - https://github.com/nanohype/eks-agent-platform
maintainers:
  - name: stxkxs
    email: rackctl@gmail.com
keywords:
  - bedrock
  - gateway
  - agents
  - dra
  - operator
  - eval
  - slo
