{{- if .Values.evalSuite.enabled -}}
{{- if not .Values.agentFleet.enabled }}
{{- fail "evalSuite.enabled requires agentFleet.enabled: spec.agentFleetRef names the fleet this suite evaluates, and with no AgentFleet rendered it points at nothing. The suite would be admitted, never evaluate, and trip AgentEvalNeverRan after 24h. Enable the fleet (with an image), or set evalSuite.enabled: false." }}
{{- end }}
apiVersion: governance.nanohype.dev/v1alpha1
kind: EvalSuite
metadata:
  name: {{ .Values.platform.name }}-eval
  namespace: {{ .Values.controlPlaneNamespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: eks-agent-platform
    agents.nanohype.dev/tenant: {{ .Values.platform.tenant }}
spec:
  platformRef:
    name: {{ .Values.platform.name }}
  agentFleetRef:
    name: {{ .Values.platform.name }}-fleet
  {{- with .Values.evalSuite.schedule }}
  schedule: {{ . | quote }}
  {{- end }}
  passThreshold: {{ .Values.evalSuite.passThreshold | quote }}
  {{- with .Values.evalSuite.casesFromManifest }}
  casesFromManifest: {{ . | quote }}
  {{- else }}
  cases:
    {{- range .Values.evalSuite.cases }}
    - name: {{ .name }}
      input: {{ .input | quote }}
      {{- with .expectContains }}
      expectContains: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .expectNotContains }}
      expectNotContains: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .expectRefusal }}
      expectRefusal: true
      {{- end }}
      {{- with .maxLatencyMs }}
      maxLatencyMs: {{ . }}
      {{- end }}
      {{- with .maxCostUsd }}
      maxCostUsd: {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
