{{- if .Values.agentFleet.enabled }}
{{- range .Values.agentFleet.agents }}
{{- if not .image }}
{{- fail (printf "agentFleet.agents[%s].image is required: AgentFleet's CRD requires spec.agents[].image, and the chart cannot invent one — it is the tenant's own build, the container the agent actually runs. Set it, or leave agentFleet.enabled false to vend the tenant without a fleet." .name) }}
{{- end }}
{{- if .tools }}
{{- fail (printf "agentFleet.agents[%s].tools is not a field of the AgentFleet CRD. It was rendered into the manifest and pruned at admission, so a tool list set here has never reached a cluster. Remove it." .name) }}
{{- end }}
{{- end }}
apiVersion: agents.nanohype.dev/v1alpha1
kind: AgentFleet
metadata:
  name: {{ .Values.platform.name }}-fleet
  namespace: {{ .Values.controlPlaneNamespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: eks-agent-platform
    agents.nanohype.dev/tenant: {{ .Values.platform.tenant }}
spec:
  platformRef:
    name: {{ .Values.platform.name }}
  scaling:
    # Defaults guard against unset values rendering as 'min: ' (empty)
    # which fails CRD integer validation. CRD-level defaulting also fires
    # at admission time, but rendering valid YAML up-front is cleaner.
    enabled: {{ .Values.agentFleet.scaling.enabled | default true }}
    min: {{ .Values.agentFleet.scaling.min | default 1 }}
    max: {{ .Values.agentFleet.scaling.max | default 10 }}
    queueDepthTrigger: {{ .Values.agentFleet.scaling.queueDepthTrigger | default 10 }}
  agents:
    {{- range .Values.agentFleet.agents }}
    - name: {{ .name }}
      systemPrompt: {{ tpl .systemPrompt $ | quote }}
      modelRoute: {{ .modelRoute }}
      image: {{ .image | quote }}
      {{- with .replicas }}
      replicas: {{ . }}
      {{- end }}
      {{- with .resources }}
      resources: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
