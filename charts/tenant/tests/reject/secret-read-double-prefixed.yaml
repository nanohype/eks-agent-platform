# expect: entries are PREFIX-RELATIVE
# Not a CRD rule — the CRD pattern permits '/', so a full path passes admission
# and the operator composes <platform>/<env>/<platform>/<env>/<name>, granting on
# a secret that does not exist. Silent, and undetectable downstream.
platform:
  name: cover
  tenant: coverco
identity:
  directSecretReads:
    - cover/production/oncall/webhook-hmac
