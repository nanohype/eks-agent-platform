# A vend with nothing but the identity fields — the chart's own defaults for
# everything else.
#
# This is the shape every automated vending path uses: the `agentctl` scaffolder
# and the portal's create form before an operator fills anything in. It is also
# the render CI validates against the CRDs, so a default that is valid YAML and
# valid Helm but `Required value` at admission fails here rather than in a
# tenant's first install.
#
# Keep this minimal. Its job is to be the least a caller can supply, so anything
# added here weakens the thing it tests.
platform:
  name: minimal
  tenant: minimalco
  persona: generic

budget:
  monthlyUsd: 100
