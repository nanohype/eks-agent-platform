# Coverage render #1 — every Platform.spec field the chart can emit, on the
# allowedModelFamilies branch. Read by scripts/check-chart-crd-coverage.py, which
# asserts the union of the ci/ renders reaches every field in the Platform CRD's
# spec schema. A field the CRD gains and the chart cannot express fails that gate.
#
# Also the readable answer to "what does the full vocabulary look like": one
# datastore per kind with every config field set, both capabilities, a
# prefix-relative secret read, and attribution on.
#
# platform.name is deliberately short — it composes with each datastore name
# against a 28-character budget (27 for kind=cache).
controlPlaneNamespace: eks-agent-platform

platform:
  name: cover
  tenant: coverco
  persona: eng
  displayName: Coverage tenant
  isolation: vcluster
  createTenant: true
  compliance:
    hipaa: true
    soc2: true

identity:
  allowedModelFamilies:
    - anthropic
    - amazon-nova
  allowedModels: []
  extraPolicyArns:
    - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
  capabilities:
    - ses
    - eventBridgeScheduler
  directSecretReads:
    - oncall/webhook-hmac
    - vendor-api-token

attribution:
  operators:
    - operator@example.com
  sessionRoleMaxDurationSeconds: 3600

datastores:
  - name: ledger
    kind: relational
    deletionPolicy: Retain
    relational:
      engineVersion: "16.6"
      minACU: "0.5"
      maxACU: "8"
      backupRetentionDays: 7
      deletionProtection: true
  - name: sessions
    kind: keyValue
    deletionPolicy: Delete
    keyValue:
      partitionKey:
        name: sessionId
        type: S
      sortKey:
        name: createdAt
        # Quoted deliberately: an unquoted N is a YAML 1.1 boolean.
        type: "N"
      billingMode: PAY_PER_REQUEST
      ttlAttribute: expiresAt
      pointInTimeRecovery: true
      globalSecondaryIndexes:
        - name: by-owner
          partitionKey:
            name: ownerId
            type: S
          sortKey:
            name: createdAt
            type: "N"
          projection: KEYS_ONLY
  - name: docs
    kind: objectStore
    objectStore:
      versioning: true
      lifecycleExpireDays: 90
  # kind=queue is required by the eventBridgeScheduler capability above: the
  # minted scheduler-invoke role's SendMessage is scoped to the tenant's own
  # queues, so the capability without a queue is a role with no grant.
  - name: work
    kind: queue
    queue:
      fifo: false
      visibilityTimeoutSeconds: 30
      # 14 days — the CRD's maximum, and over 1e6, so this value is also the
      # regression case for float-formatted numbers on portal's render path.
      messageRetentionSeconds: 1209600
      maxReceiveCount: 5
  - name: hot
    kind: cache
    cache:
      engine: valkey
      nodeType: cache.t4g.micro
      replicas: 0
  # kind=stream carries no config block.
  - name: events
    kind: stream

budget:
  monthlyUsd: 2500
  alertThresholdsPercent: [50, 80, 100]
  killSwitchEnabled: true

modelGateway:
  defaultRoute:
    name: primary
    modelFamily: anthropic
    modelId: us.anthropic.claude-sonnet-4-6
    rateLimit: 60

agentFleet:
  scaling:
    enabled: true
    min: 1
    max: 5
    queueDepthTrigger: 10
  agents:
    - name: assistant
      systemPrompt: "You are a helpful assistant."
      modelRoute: primary

evalSuite:
  enabled: true
  schedule: "0 6 * * *"
  passThreshold: "0.85"
  cases:
    - name: smoke-test
      input: "Reply with 'pong'."
      expectContains: ["pong"]
      maxLatencyMs: 5000

# Enabled here and nowhere else. This render is what
# scripts/check-crd-instantiation.py reads to prove every shipped CRD kind can
# actually be authored, so the SLOPolicy has to appear in it. The chart default
# stays off — see the comment on `slo` in values.yaml for why that default is
# load-bearing rather than cautious.
#
# Exercises the availability branch with a selector, which is the shape that
# carries the reserved-label rule.
slo:
  enabled: true
  sli:
    type: availability
    metric: cover_api
    selector:
      route: /v1/chat
  objective: "0.999"
  onPageTierBreach: HoldRollout

# The self-hosted worker pool. environmentId carries the `env_` prefix the
# template requires, and apiKeySecret is named because the scaling range below
# is wider than one replica — without the org key the operator would remove the
# ScaledObject and hold the pool at minReplicas, which the render refuses.
sandboxPool:
  enabled: true
  environmentId: env_coverage
  environmentKeySecret:
    name: cover-environment-key
    key: ANTHROPIC_ENVIRONMENT_KEY
  apiKeySecret:
    name: cover-org-api-key
    key: ANTHROPIC_API_KEY
  scaling:
    minReplicas: 2
    maxReplicas: 8
    queueDepthTarget: 4
  runtimeClassName: gvisor
