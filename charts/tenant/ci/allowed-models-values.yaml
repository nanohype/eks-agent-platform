# Coverage render #2 — the allowedModels branch, plus the no-substrate default.
#
# spec.identity.allowedModels and spec.identity.allowedModelFamilies are mutually
# exclusive in the CRD, so no single render can cover both. This render exists so
# the union of ci/ renders still reaches allowedModels; everything else here is a
# minimal tenant (no datastores, no capabilities, no attribution) which is also
# the shape the default values.yaml produces.
controlPlaneNamespace: eks-agent-platform

platform:
  name: models-only
  tenant: coverco
  persona: generic

identity:
  allowedModelFamilies: []
  allowedModels:
    - us.anthropic.claude-sonnet-5
  extraPolicyArns: []

budget:
  monthlyUsd: 100

# The suite evaluates a fleet, so the fleet has to exist. This render's job is
# spec.identity.allowedModels coverage, and it carries the pair only because a
# dangling agentFleetRef is not a shape worth committing as an example.
agentFleet:
  enabled: true
  agents:
    - name: assistant
      systemPrompt: "You are a helpful assistant."
      modelRoute: primary
      image: ghcr.io/nanohype/example/agent:0.1.0

evalSuite:
  enabled: true
