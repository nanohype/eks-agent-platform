# Opinionated tenant scaffold. Consumed by `agentctl platform new`.
#
# Render a complete tenant in one helm install:
#   helm template marketing-team ./charts/tenant \
#     --set platform.name=marketing-team \
#     --set platform.persona=marketing \
#     --set platform.tenant=acme \
#     --set budget.monthlyUsd=2500

# Where this tenant's control-plane CRs (Platform, BudgetPolicy, ModelGateway,
# AgentFleet, EvalSuite) live. This is the first dial of the tenant isolation
# tier — the template grows with you instead of being outgrown:
#   shared (default)  controlPlaneNamespace: eks-agent-platform — every tenant's
#                     control-plane CRs in one platform-team-owned namespace.
#                     Simplest; right for a startup / few tenants.
#   dedicated         controlPlaneNamespace: eap-tenant-<name> — per-tenant
#                     control-plane namespace for isolation / per-tenant GitOps
#                     granularity at scale or under compliance.
#   harder            platform.isolation: vcluster, then a dedicated cluster —
#                     the workload-side dials, orthogonal to this one.
# The Tenant CR is cluster-scoped and the operator watches Platforms
# cluster-wide, so moving a tenant up a tier is a re-render, never a migration.
# See docs/architecture/tenant-isolation-tiers.md.
controlPlaneNamespace: eks-agent-platform

platform:
  name: "" # required
  tenant: "" # required
  persona: generic # one of: sales-ops, support, finance, ops, founder, eng, marketing, legal, generic
  displayName: ""
  # Workload isolation tier. Immutable after create (changing it is a migration).
  #   namespace (default): namespace RBAC + default-deny NetworkPolicy + quota +
  #     PSS-restricted; tenant workloads share the host API server.
  #   vcluster: the same host containment PLUS a per-Platform virtual cluster, so
  #     tenant code that talks to the Kubernetes API talks to its own API server,
  #     not the host's (API-server-level isolation — NOT kernel/node isolation).
  #     Requires ArgoCD on the cluster (the operator declares the vcluster as an
  #     ArgoCD Application); the tier fails closed if ArgoCD is absent. See
  #     docs/adr/0008-vcluster-isolation-tier.md and docs/architecture/tenant-isolation-tiers.md.
  isolation: namespace # namespace | vcluster
  # Emit the cluster-scoped Tenant CR this Platform belongs to. Default true
  # (one tenant = one Platform). Set false on additional Platforms that share an
  # already-created Tenant (one Tenant owns many Platforms).
  createTenant: true
  # The compliance regimes this Platform is in scope for. A declaration, not a
  # switch — nothing is provisioned differently from it. `cloudgov platform
  # audit` checks the rest of the declaration lines up: soc2 requires the budget
  # kill-switch, and a Platform must declare at least what its Tenant declares.
  compliance:
    hipaa: false
    soc2: true

identity:
  # Either pick model families or specific models. The operator expands the
  # choice into Bedrock foundation-model + cross-region inference-profile ARNs
  # and reconciles a bedrock-model-scoping policy that denies invoke on
  # everything outside that set.
  allowedModelFamilies:
    - anthropic
    - amazon-nova
  allowedModels: []
  extraPolicyArns: []
  # Managed AWS capabilities outside the datastore vocabulary. Each one drives an
  # operator-generated `capability-access` inline policy on the tenant role, so a
  # tenant declares what it needs instead of referencing a hand-written managed
  # policy by ARN through extraPolicyArns. At most 8.
  #   ses                   sends mail. Scoped by a ses:FromAddress condition
  #                         derived from the PLATFORM NAME (*@<platform.name>.*),
  #                         so the grant is only usable when the platform name is
  #                         the sending-domain label. The verified sending
  #                         identity itself is account-level mail infra.
  #   eventBridgeScheduler  manages the tenant's own schedules, and passes an
  #                         operator-minted scheduler-invoke role that may
  #                         SendMessage to the tenant's OWN queue datastores.
  #                         Requires at least one kind=queue datastore below —
  #                         without one the minted role carries no send grant and
  #                         the capability does nothing. The chart rejects that
  #                         combination rather than shipping a silent no-op.
  capabilities: []
  # Application secrets this Platform's pods read directly through the pod role
  # via the AWS SDK. Each entry is PREFIX-RELATIVE: the operator composes the ARN
  # as <platform.name>/<environment>/<entry>, so write `oncall/webhook-hmac`, not
  # `my-platform/production/oncall/webhook-hmac` (that would grant on the prefix
  # twice). The grant is GetSecretValue/DescribeSecret on exactly these names —
  # no wildcard. Secret material projected into the pod by an ExternalSecret is
  # resolved by the External Secrets controller's own identity and needs no entry
  # here; leaving this empty means the tenant role holds no Secrets Manager
  # grant at all. At most 16.
  directSecretReads: []

# Per-session human attribution. A non-empty operators list opts the Platform in:
# the operator provisions a session role assumable by the tenant role with the
# named human carried as STS SourceIdentity, plus a ClusterRole letting the tenant
# ServiceAccount impersonate them at the apiserver — so an agent's AWS and
# Kubernetes actions both attribute to a named person. An empty list is the
# default and means unattributed; there is no boolean to flip, because the CRD
# requires at least one operator whenever the block is present.
#
# Each value must BYTE-MATCH the operator's own Kubernetes RBAC subject name (use
# a lowercased email) — the same string binds the AWS and Kubernetes audit
# records, so a mismatch attributes to nobody.
attribution:
  operators: []
  # STS role chaining hard-caps a chained session at 3600s regardless of this
  # value, because the caller is the tenant role. Larger values only matter if
  # the caller ever changes. 900–43200.
  sessionRoleMaxDurationSeconds: 3600

# The tenant's stateful substrate: the databases, buckets, queues, caches, and
# streams it needs. Each entry is a declaration, not a hand-written component —
# the generic tenant-substrate tofu module provisions the heavy resource from
# this same list, and the operator generates the scoped IAM policy that reaches
# it. Adding a tenant is therefore a declaration, never a new landing-zone
# component.
#
# TWO STEPS, TWO OWNERS. Declaring a datastore here grants the tenant role
# access to the resource's ARN and reports it under status.datastores. The
# resource itself is provisioned when the declaration reaches landing-zone's
# tenant-substrate `tenants` input. Until it does, the tenant holds a grant on a
# name that does not exist yet.
#
#   kind          AWS implementation           config block
#   relational    Aurora PostgreSQL Sv2        relational   (optional)
#   keyValue      DynamoDB                     keyValue     (REQUIRED — a table
#                                                            has no default
#                                                            partition key)
#   objectStore   S3                           objectStore  (optional)
#   queue         SQS (+ DLQ when redrive set) queue        (optional)
#   cache         ElastiCache (Valkey/Redis)   cache        (optional)
#   stream        MSK Serverless (IAM auth)    none
#
# A block may only be set for its own kind; omitting an optional block takes the
# young/light defaults the CRD declares. deletionPolicy defaults to Retain, so
# `kubectl delete platform` orphans the data rather than taking it with them —
# and the operator holds no delete permission on any datastore regardless, so
# Delete is a declaration handed to the module, not a power the operator wields.
#
# NAME BUDGET: platform.name + datastore name must total <= 28 characters (they
# compose into bucket / table / queue names against S3's 63-char ceiling), and
# <= 27 for kind=cache, whose ElastiCache replication-group id is capped at 40
# including the longest environment token. The chart checks both.
#
# ACU values (relational.minACU / maxACU) are STRINGS per the Kubernetes
# convention for fractional numbers — write "0.5", not 0.5.
#
#   datastores:
#     - name: docs
#       kind: objectStore
#       objectStore:
#         versioning: true
#     - name: sessions
#       kind: keyValue
#       keyValue:
#         partitionKey:
#           name: sessionId
#           type: S
#     - name: work
#       kind: queue
#       queue:
#         maxReceiveCount: 5
datastores: []

budget:
  monthlyUsd: 500
  alertThresholdsPercent: [50, 80, 100]
  killSwitchEnabled: true

# Persona-specific defaults for the ModelGateway + AgentFleet.
modelGateway:
  defaultRoute:
    name: primary
    modelFamily: anthropic
    # llm-policy default tier. This is already a us. cross-region inference
    # profile, so no separate crossRegionProfile is needed.
    modelId: us.anthropic.claude-sonnet-5
    rateLimit: 60

# The tenant's agent workloads.
#
# OFF by default, and that default is load-bearing rather than cautious. The
# AgentFleet CRD requires spec.agents[].image — the container the agent actually
# runs, which is the tenant's own build — and a generic chart has nothing
# truthful to put there. Rendered without it the manifest is valid YAML, valid
# Helm, and rejected by the API server: `spec.agents[0].image: Required value`.
# Every default `helm install` of this chart failed at admission, which also took
# the Platform, BudgetPolicy and ModelGateway in the same release with it.
#
# So vending a tenant no longer implies declaring its fleet. Turn this on when
# there is an image to name; the chart fails the render, with the reason, if it
# is on and an agent has no image.
agentFleet:
  enabled: false
  scaling:
    enabled: true
    min: 1
    max: 5
    queueDepthTrigger: 10
  agents:
    - name: assistant
      systemPrompt: "You are a helpful assistant for the {{ .Values.platform.persona }} persona."
      modelRoute: primary
      # image: ghcr.io/<org>/<tenant>/agent:1.2.3

# Scheduled quality evaluation of this tenant's agent fleet.
#
# OFF by default because agentFleet is, and the two cannot disagree:
# spec.agentFleetRef names the fleet this suite evaluates, so an EvalSuite over an
# absent fleet is admitted, never evaluates, and trips AgentEvalNeverRan after 24
# hours. The chart fails the render rather than letting that ship.
evalSuite:
  enabled: false
  schedule: "0 6 * * *" # daily 06:00 UTC
  passThreshold: "0.85"
  casesFromManifest: "" # empty = inline default cases below
  cases:
    - name: smoke-test
      input: "Reply with 'pong'."
      expectContains: ["pong"]
      maxLatencyMs: 5000

# Service-level objective for this tenant.
#
# OFF by default, and unlike evalSuite that default is load-bearing rather than
# cautious. The SLO loop is only live once the tenant emits the series the SLI
# names — the reconciler builds its PromQL from `sli.metric` plus the suffix
# `sli.type` implies, so an objective over a series nothing publishes is
# permanently unevaluated. kube-state-metrics projects `status.lastEvaluated`
# with nilIsZero, and the AgentSLOEvaluationStale alert reads that projection,
# so a policy that never evaluates trips a standing alert within the hour. That
# is the correct behaviour for an objective that stopped being measured; it is
# the wrong first impression of one that was never measurable.
#
# So: instrument the workload first, confirm the series is in the metric store,
# then set enabled: true. The values below are the shape, not a default anyone
# should adopt unread.
slo:
  enabled: false
  # availability divides an errors counter by a requests counter; latency
  # divides a duration histogram's under-threshold bucket by its count.
  sli:
    type: availability
    # The base series name in Prometheus form, WITHOUT the suffix the type
    # implies. For type=availability the reconciler queries
    # <metric>_errors_total over <metric>_requests_total, so a workload whose
    # counter is named `http_request_total` (singular) does not answer to
    # `http` here.
    metric: ""
    # Exact-match label narrowing. `le` and `__name__` are reserved — the first
    # is owned by the latency query's bucket boundary, the second would redirect
    # the query at a different series entirely.
    selector: {}
    # Set this when the workload emits ONE counter with a status dimension
    # rather than a separate errors counter — which is the ordinary OTel shape.
    # The objective then reads
    #   <metric>_requests_total{<selector>,<errorSelector>}
    #     over <metric>_requests_total{<selector>}
    # instead of dividing a distinct _errors_total series by _requests_total,
    # so a service does not need a second, redundant counter to be measurable.
    # Availability only. Same reserved labels as selector.
    errorSelector: {}
    # Decimal seconds naming a bucket boundary the histogram actually
    # publishes. Required for type=latency, rejected for type=availability.
    thresholdSeconds: ""
  # Target good-event ratio. The error budget is 1 - objective.
  objective: "0.999"
  # HoldRollout patches a deny syncWindow onto this tenant's ArgoCD AppProject
  # so a bad rollout stops advancing, leaving manualSync open for a fix. It acts
  # only on a per-Platform AppProject; a tenant synced under the shared
  # `platform` project has nothing for the hold to write to, and the policy
  # reports RolloutHeld=Unknown/AppProjectAbsent rather than holding anything.
  # None evaluates, publishes and pages without touching the cluster.
  onPageTierBreach: None

# ── Sandbox pool ────────────────────────────────────────────────────────────
#
# A pool of self-hosted Managed Agents workers. Each worker runs `ant
# beta:worker`, claiming sessions from a `self_hosted` environment's work queue
# and executing the agent's tool calls inside the cluster — agent code and its
# filesystem never leave the tenant namespace.
#
# Off by default because it cannot be defaulted into usefulness: it needs a real
# Managed Agents environment id and the environment key that authenticates
# workers against it, and neither has a sensible placeholder.
sandboxPool:
  enabled: false
  # The `self_hosted` environment whose work queue these workers drain, as an
  # `env_...` id from the Managed Agents console.
  environmentId: ""
  # ANTHROPIC_ENVIRONMENT_KEY — the worker's own auth token, mounted into every
  # worker pod. Create the Secret out of band (external-secrets, sealed-secrets)
  # and name it here; the chart never carries the value.
  environmentKeySecret:
    name: ""
    key: ANTHROPIC_ENVIRONMENT_KEY
  # The organization API key, read ONLY by the queue-depth autoscaler so it can
  # call the work-stats endpoint. It is never mounted into a worker pod —
  # Anthropic's guidance is that the org key must not be reachable from agent
  # tool calls, and the operator honours that by giving it only to the metrics
  # bridge.
  #
  # Leave the name empty to run the pool at a static replica count. Queue-depth
  # autoscaling needs this key: without it the operator tears down the KEDA
  # ScaledObject and pins the Deployment to scaling.minReplicas.
  apiKeySecret:
    name: ""
    key: ANTHROPIC_API_KEY
  scaling:
    minReplicas: 1
    maxReplicas: 10
    # Queued sessions per worker that KEDA scales toward.
    queueDepthTarget: 5
  # Per-worker resources. Agent tool calls run in this container, so size it for
  # the workload's builds and tests rather than for a request handler.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  # Set to run workers under a hardened runtime (gVisor, Kata). Empty uses the
  # cluster default.
  runtimeClassName: ""
  # Overrides the worker image. Empty uses the platform's published
  # sandbox-worker, whose tag the operator pins in lockstep with its own
  # release.
  image: ""
