name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Tuesday 06:00 UTC — catches new CVEs even when no PRs land.
    - cron: "0 6 * * 2"

# Least privilege at the workflow level. security-events: write is granted only
# to the three jobs that upload a SARIF report — a workflow-level grant would
# hand the ability to write code-scanning results to every job, including the
# ones that only run a linter.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The official gitleaks-action gates organization repos behind a paid
      # license; the gitleaks CLI itself is free. Pin the version, verify the
      # download against its published sha256, then run it directly — a tampered
      # or swapped tarball fails the checksum instead of executing.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_${VERSION}_linux_x64.tar.gz from the release
          # checksums.txt — bump both together when moving versions.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner .

  trivy-config:
    name: trivy (terraform + dockerfile misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # uploads a SARIF report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          # Inherent privilege requirements (device plugins, operator
          # ClusterRole) are suppressed with file-scoped justifications
          # in .trivyignore.yaml. Anything not in that file IS expected
          # to fail the build.
          trivyignores: ".trivyignore.yaml"
          exit-code: "1"
          # No ignore-unfixed here: it only applies to CVE scanning. A
          # misconfiguration finding is always fixable in-repo (it is our own
          # terraform/Dockerfile), so nothing is ever "unfixed" to ignore.
          format: sarif
          output: trivy-config.sarif
          # Helm scanning is covered by the ci workflow's helm lint +
          # template job. trivy's helm scanner uses a default k8s 1.20
          # client which can't render our kubeVersion-pinned chart, and
          # falls over on required values without overrides — those
          # errors aren't security findings.
          skip-dirs: "charts"
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  trivy-fs:
    name: trivy (filesystem vuln scan — go + npm deps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # uploads a SARIF report
    env:
      # trivy's pnpm parser drops dev dependencies unless told otherwise, and the
      # job name above claims npm coverage it therefore did not have: it reported
      # zero while the lockfile carried two fixable HIGHs. A build-time package
      # still executes in CI holding this repo's credentials, which is squarely
      # the surface this job exists to watch, and the repos scanning the same
      # trees with osv-scanner have always counted dev dependencies — the two
      # tools returned opposite verdicts on one advisory in one org.
      #
      # Set as an env var because trivy-action exposes no input for the flag.
      # Job-level so both invocations below inherit it and cannot drift apart.
      TRIVY_INCLUDE_DEV_DEPS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Two invocations on purpose, because one cannot do both jobs.
      #
      # The trivy-action rebuilds a SARIF report with ALL severities regardless of
      # the severity input ("Building SARIF report with all severities" in its
      # own log), and then applies exit-code to whatever it found. So a single
      # sarif-format step with severity: HIGH,CRITICAL and ignore-unfixed: true
      # fails the build on a MEDIUM, and on an UNKNOWN with no fix available —
      # precisely the two categories the policy below says it deliberately does
      # not fail on. That is how this gate came to be red on main over an
      # advisory about an unmaintained transitive package nobody can patch.
      #
      # Report first, gate second: the upload keeps every severity visible in
      # code scanning, and the gate enforces the documented policy.
      - name: Report every finding to code scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "0"
          format: sarif
          output: trivy-fs.sarif
          skip-dirs: "node_modules,**/.terraform"
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      # The build gate. Table format, so severity and ignore-unfixed actually
      # apply to the exit code.
      #
      # ignore-unfixed stays true here (dependency CVE scan), deliberately.
      # A HIGH/CRITICAL with no upstream fix can't be remediated by a version
      # bump, so failing on it would be a permanent, unactionable red that
      # blocks unrelated PRs. The weekly schedule (cron above) re-runs the
      # scan, so the moment a patched release ships the finding surfaces and
      # the fix is a normal go.mod/package.json bump. Fixable HIGH/CRITICAL
      # still fail the build immediately.
      - name: Fail on a fixable HIGH or CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-dirs: "node_modules,**/.terraform"

  # A workflow runs with this repository's credentials on every push, so the
  # workflows ARE a dependency surface and their defects are supply-chain
  # defects. zizmor is the scanner for that surface, sitting beside trivy and
  # govulncheck rather than in a reviewer's head.
  #
  # --offline is load-bearing: without it the audit resolves actions over the
  # network, and the verdict becomes a function of what GitHub answers at that
  # moment instead of a function of the commit under test. A gate whose result
  # depends on the network cannot be reasoned about from the diff.
  #
  # --persona=auditor, and the persona is a DIFFERENT AXIS FROM SEVERITY. The
  # default persona does not run the excessive-permissions audit at all, so a
  # workflow declaring `id-token: write` at the top level — handing every job
  # added later the right to mint an OIDC token, with no diff that looks like a
  # permission change — exits 0 under the default and 14 under auditor. Measured
  # on exactly that input; this repo passes either way only because its
  # permissions are already per-job, which is luck rather than coverage.
  #
  # --min-severity=low fails on low and above. zizmor's own default is
  # informational, so ANY --min-severity can only suppress — the flag was
  # measured in that direction rather than assumed, and low is the tightest
  # setting this tree holds. A threshold is only safe if the output admits what
  # sits under it: `No findings to report. Good job!` is what
  # zizmor prints when the tiers below the threshold are full, and a reader
  # cannot tell that from a clean tree. So the step scans every severity and
  # prints the per-tier counts BEFORE the gating run, and the pass line names the
  # tiers it did not fail on.
  zizmor:
    name: zizmor (workflow static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: zizmor
        env:
          # Pinned for the reason the tflint step below states. The rule set is
          # part of the verdict, so an unpinned scanner turns an unrelated PR red
          # or green with no change in this repository.
          ZIZMOR_VERSION: "1.29.0"
        run: |
          pip install "zizmor==${ZIZMOR_VERSION}"

          # Every tier first. `|| true` because a non-empty scan exits non-zero
          # by design here; the verdict comes from the gating run below.
          zizmor --offline --persona=auditor --config .github/zizmor.yml \
            --min-severity=informational .github/workflows/ > all-tiers.txt 2>&1 || true
          echo "::group::every severity, including tiers this gate does not fail on"
          grep -E '^[0-9]+ findings|^No findings' all-tiers.txt || tail -3 all-tiers.txt
          echo "::endgroup::"

          # The verdict. Exit status is read directly off zizmor, not off a
          # pipeline, so it is zizmor's status and not some downstream tool's.
          zizmor --offline --persona=auditor --config .github/zizmor.yml \
            --min-severity=low .github/workflows/
          echo "zizmor: nothing at medium or above. Informational and low are NOT gated here; their counts are in the group above."

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6
        with:
          # Pinned, not `latest`. Resolving "latest" is itself an unauthenticated
          # GitHub API call, and an unpinned linter means a new rule release can
          # turn an unrelated PR red with no change on our side.
          tflint_version: v0.64.0
      # tflint --init downloads the AWS ruleset from GitHub releases. Without a
      # token that request is anonymous, which is the 60-per-hour IP-scoped
      # limit shared with every other job leaving the same runner egress
      # address — so this step fails with "API rate limit exceeded for <ip>" at
      # random, on a diff that touched no terraform. GITHUB_TOKEN moves it to
      # the authenticated limit, which this job cannot realistically reach.
      - run: tflint --init --config .tflint.hcl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # --chdir changes CWD so .tflint.hcl resolution must be absolute.
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --chdir=terraform/components --minimum-failure-severity=warning

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # uploads a SARIF report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: operators/go.mod
          cache-dependency-path: operators/go.sum
      - uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        with:
          args: -severity medium -fmt sarif -out gosec.sarif ./operators/...
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    env:
      GOLANGCI_VERSION: v2.12.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: operators/go.mod
          cache-dependency-path: operators/go.sum
      # verify: false — see the note in ci.yaml. The default schema check is a
      # network fetch that fails the job when golangci-lint.run is unreachable.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: operators
          version: ${{ env.GOLANGCI_VERSION }}
          verify: false

  # govulncheck complements the trivy dependency scan: it is Go-vulnerability-DB
  # aware and call-graph-driven, so it only reports advisories whose vulnerable
  # symbol the operator actually reaches — far less noise than a manifest-level
  # scan, and it covers stdlib CVEs (a Go-toolchain fix) that trivy's fs scan
  # misses. Runs on every PR and on the weekly schedule.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: operators/go.mod
          cache-dependency-path: operators/go.sum
      - name: govulncheck
        working-directory: operators
        env:
          # Pinned for the reason the tflint step above states, and with more
          # riding on it: this is the gate that decides whether the Go supply
          # chain is clean, so resolving it from @latest fetches an unverified
          # version of the thing doing the verifying, and a release that changes
          # what it reports turns an unrelated PR red or green with no change
          # here. The vulnerability DATA is fetched at run time and stays
          # current regardless — pinning the tool does not pin the advisories.
          GOVULNCHECK_VERSION: v1.7.0
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...

  merge-gate-security:
    name: merge gate (security)
    runs-on: ubuntu-latest
    needs:
      [
        gitleaks,
        zizmor,
        trivy-config,
        trivy-fs,
        tflint,
        gosec,
        golangci,
        govulncheck,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@90af851a854ca24dd6626ccc660b0b1b245c406a # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate-security
