# Does the registry still serve what this repo says it publishes?
#
# The blocking half of this question lives in ci.yaml as `chart-version-bump`:
# a chart whose packaged content changes in a PR must move its version. That is
# a function of the commit, so it belongs on the merge path.
#
# This half is not. A chart can be correct at every merge and still drift from
# the registry — the version-bump gate compares against the merge base, so a PR
# that does not touch an already-drifted chart is not wrong about it and cannot
# be failed for it. charts/operator sat drifted at 0.6.3 for exactly that
# reason: the PR that introduced it was the last one that could have caught it.
#
# So this runs on a schedule and reports the drift the next morning, instead of
# leaving it for whoever next tries to cut a release and finds it blocked on
# something they did not do.
#
# It lives in its own file rather than as a job in ci.yaml because the merge
# gate refuses any workflow containing a job it does not watch, and counts a
# skipped dependency as a failure — a schedule-only job cannot live there.
name: chart drift

on:
  schedule:
    # Monday 07:00 UTC, before the week's first release would be cut.
    - cron: "0 7 * * 1"
  workflow_dispatch:

# A drift report describes the state at the moment it runs, so a newer run
# supersedes one still in flight rather than queueing behind it.
concurrency:
  group: chart-drift
  cancel-in-progress: true

permissions:
  contents: read
  packages: read   # read the published chart digests this compares against

jobs:
  published:
    name: source and registry agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - run: ./scripts/check-chart-version-bump.py --self-test
      - run: ./scripts/check-chart-version-bump.py --published

  # The world-controlled half of the image gate. Its verdict changes when a
  # package is deleted or a registry has an outage, neither of which a pull
  # request causes — so it reports here rather than blocking a merge. The
  # enumeration half runs on every PR in ci.yaml as `image-refs`.
  #
  # A red run here is a real finding about the estate, not about the diff: it
  # means something this tree names can no longer be pulled.
  image-refs-registry:
    name: every image the chart names is still published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: docker login (ghcr.io)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - run: ./scripts/check-image-refs.py --list
