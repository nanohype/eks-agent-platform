name: release

# One way in: a tag.
#
# `operator-v1.2.3` builds, signs and publishes exactly that component. Nothing
# else does, and that is the point rather than an omission: keyless OIDC signing
# from a branch push produces a certificate whose subject ends
# `release.yaml@refs/heads/<branch>`, and eks-gitops' Kyverno `verify-images`
# policy admits only `release\.ya?ml@refs/tags/.+` (Enforce on staging and
# production), so a branch-built image is denied at admission on every cluster
# it was built for.
#
# The invariant a branch build would defend is held by
# `scripts/check-image-refs.py`, a required check: a PR that points the chart at
# an unpublished image cannot merge. Tag the code, then point the chart at what
# exists.
on:
  push:
    tags:
      - "operator-v*"
      - "sandbox-worker-v*"
      - "eval-runner-v*"
      - "charts-v*"
      - "sdk-v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  plan:
    name: what needs releasing
    runs-on: ubuntu-latest
    outputs:
      operator: ${{ steps.plan.outputs.operator }}
      eval_runner: ${{ steps.plan.outputs.eval_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: derive
        id: plan
        run: |
          set -euo pipefail

          # A tag releases exactly its own component and nothing else, so every
          # other output stays empty. There is no other branch to take: the only
          # trigger is a tag push.
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "plan: $1 -> ${2:-<nothing to do>}"; }

          tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
            operator-v*)    emit operator    "${tag#operator-v}";    emit eval_runner "" ;;
            eval-runner-v*) emit eval_runner "${tag#eval-runner-v}"; emit operator    "" ;;
            *)              emit operator ""; emit eval_runner "" ;;
          esac

  operator-image:
    name: build + sign operator image
    needs: plan
    if: needs.plan.outputs.operator != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: operators/go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: derive version
        id: ver
        run: echo "version=${{ needs.plan.outputs.operator }}" >> "$GITHUB_OUTPUT"
      - name: docker login (ghcr.io)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: build + push (multi-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: operators/
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}/operator:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}/operator:latest
      - name: sign (keyless, OIDC)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/operator:${{ steps.ver.outputs.version }}
      - name: sbom
        run: |
          syft "ghcr.io/${{ github.repository }}/operator:${{ steps.ver.outputs.version }}" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson ghcr.io/${{ github.repository }}/operator:${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-operator-${{ steps.ver.outputs.version }}
          path: sbom.spdx.json
      # Record the release as a tag when main triggered it, so `git tag` and the
      # registry never disagree about what shipped. Written with GITHUB_TOKEN,
      # which deliberately cannot re-trigger this workflow.

  sandbox-worker-image:
    name: build + sign sandbox worker image
    if: startsWith(github.ref, 'refs/tags/sandbox-worker-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: derive version
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/sandbox-worker-v}" >> "$GITHUB_OUTPUT"
      - name: docker login (ghcr.io)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: build + push (multi-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: sandbox-worker/
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}/sandbox-worker:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}/sandbox-worker:latest
      - name: sign (keyless, OIDC)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/sandbox-worker:${{ steps.ver.outputs.version }}
      - name: sbom
        run: |
          syft "ghcr.io/${{ github.repository }}/sandbox-worker:${{ steps.ver.outputs.version }}" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson ghcr.io/${{ github.repository }}/sandbox-worker:${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-sandbox-worker-${{ steps.ver.outputs.version }}
          path: sbom.spdx.json

  eval-runner-image:
    name: build + sign eval runner image
    needs: plan
    if: needs.plan.outputs.eval_runner != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: derive version
        id: ver
        run: echo "version=${{ needs.plan.outputs.eval_runner }}" >> "$GITHUB_OUTPUT"
      - name: docker login (ghcr.io)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: build + push (multi-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Repo root context: the image bundles the pnpm workspace (the runner
          # builds on @eks-agent/core + @eks-agent/pricing).
          context: .
          file: packages/eval-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}/eval-runner:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}/eval-runner:latest
      - name: sign (keyless, OIDC)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/eval-runner:${{ steps.ver.outputs.version }}
      - name: sbom
        run: |
          syft "ghcr.io/${{ github.repository }}/eval-runner:${{ steps.ver.outputs.version }}" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson ghcr.io/${{ github.repository }}/eval-runner:${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-eval-runner-${{ steps.ver.outputs.version }}
          path: sbom.spdx.json
      # Record the release as a tag when main triggered it, so `git tag` and the
      # registry never disagree about what shipped. Written with GITHUB_TOKEN,
      # which deliberately cannot re-trigger this workflow.

  charts-oci:
    name: package + push charts to OCI
    if: startsWith(github.ref, 'refs/tags/charts-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: package + push
        env:
          REGISTRY: oci://ghcr.io/${{ github.repository }}/charts
        run: |
          set -euo pipefail

          # A charts-v tag packages every chart in charts/ at whatever version
          # its own Chart.yaml declares — the tag is only a trigger, it names no
          # version. So most tags re-push charts that did not change, and an OCI
          # tag is mutable: pushing 0.3.0 a second time replaces what every
          # cluster already resolved. Identical content makes that a no-op, but
          # a chart edited without a version bump would be swapped underneath
          # running clusters with nothing to say so.
          #
          # So this refuses to overwrite. For each chart the published version
          # is either absent (publish), byte-identical (skip), or different
          # (fail — the chart changed and the version did not).
          #
          # The comparison packages the source and compares the extracted
          # trees rather than the tarballs: helm rewrites Chart.yaml on package
          # (keys reordered, comments dropped) and stamps mtimes, so source and
          # registry only compare equal once both have been through
          # `helm package`.
          published=0
          skipped=0

          for d in charts/*/; do
            name=$(basename "$d")
            version=$(helm show chart "$d" | awk '/^version:/ {print $2; exit}')
            if [ -z "$version" ]; then
              echo "::error::${name}/Chart.yaml declares no version"
              exit 1
            fi

            # Per-chart output dir so the glob expansion in helm push has
            # exactly one match — sharing /tmp/charts/ across charts would
            # let helm push see multiple .tgz files and fail with
            # "exactly one positional argument expected".
            work="/tmp/charts/${name}"
            mkdir -p "${work}/candidate"
            helm package "$d" -d "$work"
            tgz="${work}/${name}-${version}.tgz"
            tar xzf "$tgz" -C "${work}/candidate"

            # Three outcomes, and anything else stops the job. An unrecognized
            # registry error must not fall through to a push — that is the one
            # path that could overwrite a live version. Login runs as its own
            # step above, so by here auth is established and `denied` means the
            # package does not exist yet (GHCR does not distinguish an absent
            # package from an unreadable one).
            state=unknown
            for attempt in 1 2 3; do
              if err=$(helm show chart "${REGISTRY}/${name}" --version "$version" 2>&1); then
                state=present
                break
              fi
              case "$err" in
                *"not found"*|*NAME_UNKNOWN*|*MANIFEST_UNKNOWN*|*denied*)
                  state=absent
                  break
                  ;;
              esac
              echo "attempt ${attempt}: could not read ${name} ${version}: ${err}"
              sleep 5
            done

            case "$state" in
              present)
                helm pull "${REGISTRY}/${name}" --version "$version" \
                  -d "$work" --untar --untardir published
                if diff -r "${work}/published/${name}" "${work}/candidate/${name}" >/dev/null; then
                  echo "skip ${name} ${version} — already published, identical content"
                  skipped=$((skipped + 1))
                  continue
                fi
                echo "::error::${name} ${version} is already published with different content."
                echo "The chart changed without a version bump. Bump ${name}/Chart.yaml"
                echo "and tag again — overwriting a published version would swap the chart"
                echo "underneath every cluster already resolving it."
                diff -r "${work}/published/${name}" "${work}/candidate/${name}" || true
                exit 1
                ;;
              absent)
                helm push "$tgz" "$REGISTRY"
                published=$((published + 1))
                ;;
              *)
                echo "::error::could not determine whether ${name} ${version} is published."
                echo "Refusing to push — the last error was: ${err}"
                exit 1
                ;;
            esac
          done

          echo "published=${published} skipped=${skipped}"

          # A charts-v tag that publishes nothing is a tag pushed without a
          # version bump. Passing green would report a release that did not
          # happen — the same shape as the alerting path this repo just deleted.
          if [ "$published" -eq 0 ]; then
            echo "::error::this tag published no chart — every chart in charts/ is already"
            echo "at its published version. Bump the chart you meant to release and tag again."
            exit 1
          fi

  sdk-npm:
    name: publish @eks-agent/* to npm
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
