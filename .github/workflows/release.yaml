name: release

# Two ways in, one build definition.
#
# A tag is the explicit release: push `operator-v1.2.3` and that is what ships.
#
# A push to main is the safety net, and it exists because the alternative
# failed in a way nothing noticed. `charts/operator/Chart.yaml` carried
# `appVersion: 0.4.0` for eighty commits while GHCR's newest operator tag was
# `0.3.2`, because the version bump rode in on a feature commit and no tag ever
# followed. The addons-agent-operator ApplicationSet renders this chart from
# main with `image.tag: ""` — which resolves to appVersion — so every cluster
# syncing it got ImagePullBackOff on the operator itself, and with the operator
# down nothing it reconciles ran either.
#
# So main now releases what main declares. The plan job reads the version out
# of the chart, asks the registry whether it is already published, and builds
# only when it is not. Idempotent by construction: the ordinary push, where the
# version has not moved, is a single API call and no build.
#
# The tag it writes back is a record, not a trigger. A tag pushed with
# GITHUB_TOKEN cannot start another workflow run — GitHub blocks that to
# prevent recursion — which is exactly why the release lives in this workflow
# rather than in a separate auto-tagger that would have quietly done nothing.
on:
  push:
    branches:
      - main
    tags:
      - "operator-v*"
      - "sandbox-worker-v*"
      - "eval-runner-v*"
      - "charts-v*"
      - "sdk-v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  plan:
    name: what needs releasing
    runs-on: ubuntu-latest
    outputs:
      operator: ${{ steps.plan.outputs.operator }}
      eval_runner: ${{ steps.plan.outputs.eval_runner }}
    steps:
      - uses: actions/checkout@v4
      - name: derive
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Published? Asked per component, against the package's own version
          # list. A 404 on the package itself means nothing has ever been
          # published under that name, which is its own kind of missing.
          published() {
            gh api --paginate "/orgs/${{ github.repository_owner }}/packages/container/$1/versions" \
              --jq '.[].metadata.container.tags[]' 2>/dev/null | grep -qxF "$2"
          }

          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "plan: $1 -> ${2:-<nothing to do>}"; }

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # An explicit tag releases exactly its own component and nothing
            # else, so the other output stays empty.
            tag="${GITHUB_REF#refs/tags/}"
            case "$tag" in
              operator-v*)    emit operator    "${tag#operator-v}";    emit eval_runner "" ;;
              eval-runner-v*) emit eval_runner "${tag#eval-runner-v}"; emit operator    "" ;;
              *)              emit operator ""; emit eval_runner "" ;;
            esac
            exit 0
          fi

          # On main the chart is the source of truth: whatever it tells a
          # cluster to pull is what has to exist.
          op=$(grep -E '^appVersion:' charts/operator/Chart.yaml | head -1 | tr -d '"' | awk '{print $2}')
          ev=$(awk '/^evalRuntime:/{f=1} f && /^[[:space:]]+tag:/{gsub(/"/,"",$2); print $2; exit}' charts/operator/values.yaml)

          if [ -z "$op" ] || [ -z "$ev" ]; then
            echo "::error::could not read a version out of the chart (operator='$op' eval-runner='$ev')"
            exit 1
          fi

          published "eks-agent-platform%2Foperator"    "$op" && emit operator    "" || emit operator    "$op"
          published "eks-agent-platform%2Feval-runner" "$ev" && emit eval_runner "" || emit eval_runner "$ev"

  operator-image:
    name: build + sign operator image
    needs: plan
    if: needs.plan.outputs.operator != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operators/go.mod
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: derive version
        id: ver
        run: echo "version=${{ needs.plan.outputs.operator }}" >> "$GITHUB_OUTPUT"
      - name: docker login (ghcr.io)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: build + push (multi-arch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: operators/
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}/operator:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}/operator:latest
      - name: sign (keyless, OIDC)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/operator:${{ steps.ver.outputs.version }}
      - name: sbom
        run: |
          syft "ghcr.io/${{ github.repository }}/operator:${{ steps.ver.outputs.version }}" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson ghcr.io/${{ github.repository }}/operator:${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-operator-${{ steps.ver.outputs.version }}
          path: sbom.spdx.json
      # Record the release as a tag when main triggered it, so `git tag` and the
      # registry never disagree about what shipped. Written with GITHUB_TOKEN,
      # which deliberately cannot re-trigger this workflow.
      - name: record the tag
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="operator-v${{ steps.ver.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists — nothing to record"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "recorded $tag"

  sandbox-worker-image:
    name: build + sign sandbox worker image
    if: startsWith(github.ref, 'refs/tags/sandbox-worker-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: derive version
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/sandbox-worker-v}" >> "$GITHUB_OUTPUT"
      - name: docker login (ghcr.io)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: build + push (multi-arch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: sandbox-worker/
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}/sandbox-worker:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}/sandbox-worker:latest
      - name: sign (keyless, OIDC)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/sandbox-worker:${{ steps.ver.outputs.version }}
      - name: sbom
        run: |
          syft "ghcr.io/${{ github.repository }}/sandbox-worker:${{ steps.ver.outputs.version }}" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson ghcr.io/${{ github.repository }}/sandbox-worker:${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-sandbox-worker-${{ steps.ver.outputs.version }}
          path: sbom.spdx.json

  eval-runner-image:
    name: build + sign eval runner image
    needs: plan
    if: needs.plan.outputs.eval_runner != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: derive version
        id: ver
        run: echo "version=${{ needs.plan.outputs.eval_runner }}" >> "$GITHUB_OUTPUT"
      - name: docker login (ghcr.io)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: build + push (multi-arch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          # Repo root context: the image bundles the pnpm workspace (the runner
          # builds on @eks-agent/core + @eks-agent/pricing).
          context: .
          file: packages/eval-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}/eval-runner:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}/eval-runner:latest
      - name: sign (keyless, OIDC)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/eval-runner:${{ steps.ver.outputs.version }}
      - name: sbom
        run: |
          syft "ghcr.io/${{ github.repository }}/eval-runner:${{ steps.ver.outputs.version }}" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson ghcr.io/${{ github.repository }}/eval-runner:${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-eval-runner-${{ steps.ver.outputs.version }}
          path: sbom.spdx.json
      # Record the release as a tag when main triggered it, so `git tag` and the
      # registry never disagree about what shipped. Written with GITHUB_TOKEN,
      # which deliberately cannot re-trigger this workflow.
      - name: record the tag
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="eval-runner-v${{ steps.ver.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists — nothing to record"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "recorded $tag"

  charts-oci:
    name: package + push charts to OCI
    if: startsWith(github.ref, 'refs/tags/charts-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: package + push
        run: |
          # Per-chart output dir so the glob expansion in helm push has
          # exactly one match — sharing /tmp/charts/ across charts would
          # let helm push see multiple .tgz files and fail with
          # "exactly one positional argument expected".
          for d in charts/*/; do
            name=$(basename "$d")
            mkdir -p "/tmp/charts/${name}"
            helm package "$d" -d "/tmp/charts/${name}"
            tgz="$(ls "/tmp/charts/${name}/${name}"-*.tgz | head -1)"
            helm push "$tgz" "oci://ghcr.io/${{ github.repository }}/charts"
          done

  sdk-npm:
    name: publish @eks-agent/* to npm
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
