name: release

# One way in: a tag.
#
# `operator-v1.2.3` builds, signs and publishes exactly that component. Nothing
# else does, and that is the point rather than an omission: keyless OIDC signing
# from a branch push produces a certificate whose subject ends
# `release.yaml@refs/heads/<branch>`, and eks-gitops' Kyverno `verify-images`
# ImageValidatingPolicy accepts only `release\.ya?ml@refs/tags/.+`, so a
# branch-built image is denied at admission on staging and production (Deny)
# and reported on development (Audit). The same policy requires an SPDX SBOM
# attestation from that identity beside the signature. It is defined in
# eks-gitops/policies/kyverno/supply-chain and lands in eks-gitops together with
# the Kyverno 3.9.2 chart it runs on; SECURITY.md states its full contract.
#
# The invariant a branch build would defend is held by
# `scripts/check-image-refs.py`, a required check: a PR that points the chart at
# an unpublished image cannot merge. Tag the code, then point the chart at what
# exists.
# A release publishes immutable, signed artifacts, so a run in flight is never
# cancelled: interrupting between `cosign sign` and `cosign attest` leaves a
# signed image carrying no attestation, which the admission policy rejects while
# the tag looks published. Grouping by ref lets independent component tags run
# together and makes a re-run of one tag queue behind itself.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "operator-v*"
      - "sandbox-worker-v*"
      - "eval-runner-v*"
      - "charts-v*"
      - "sdk-v*"

# Least privilege at the workflow level; each job below grants itself only what
# it needs. A workflow-level grant applies to every job including the ones that
# only read, so a compromised step in the planning job would hold the same
# package-write and OIDC token as the publishing ones.
permissions:
  contents: read

jobs:
  plan:
    name: what needs releasing
    runs-on: ubuntu-latest
    outputs:
      operator: ${{ steps.plan.outputs.operator }}
      eval_runner: ${{ steps.plan.outputs.eval_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: derive
        id: plan
        run: |
          set -euo pipefail

          # A tag releases exactly its own component and nothing else, so every
          # other output stays empty. There is no other branch to take: the only
          # trigger is a tag push.
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "plan: $1 -> ${2:-<nothing to do>}"; }

          tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
            operator-v*)    emit operator    "${tag#operator-v}";    emit eval_runner "" ;;
            eval-runner-v*) emit eval_runner "${tag#eval-runner-v}"; emit operator    "" ;;
            *)              emit operator ""; emit eval_runner "" ;;
          esac

  operator-image:
    name: build + sign operator image
    needs: plan
    if: needs.plan.outputs.operator != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push this component's image to ghcr.io under this repository
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # cache: false on every release build. The cache is writable by any
      # workflow on the repository, including one running from a pull request,
      # so a poisoned entry restored here would be baked into a signed artifact
      # and attested as if it came from this commit. A release runs rarely; the
      # cache buys a minute and costs the thing the signature is supposed to
      # mean.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: operators/go.mod
          cache: false
      # cosign v3 writes each signature and attestation as a Sigstore bundle
      # attached to the image digest as an OCI referrer, a format the
      # `verify-images` ImageValidatingPolicy named in the header reads. The
      # cosign release is pinned here rather than taken from the installer's
      # default, so the signature format the clusters verify moves only through
      # a reviewed bump.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: derive version
        id: ver
        # An EMPTY version is not rejected downstream — it is a valid instruction.
        # `ghcr.io/owner/repo/operator:` is a reference with no tag, which a
        # registry resolves rather than refuses, so the job would build, sign and
        # publish against something nobody proposed and report success.
        #
        # Asserted with a shell conditional rather than an external tool: a guard
        # that asks its question through a binary is deleted by the absence of
        # that binary. On refusal NOTHING is written to the output, so no later
        # step has a bad value to misread.
        env:
          RAW: "${{ needs.plan.outputs.operator }}"
        run: |
          if [ -z "$RAW" ]; then
            echo "::error::derived an empty version from the plan job; refusing to tag an image with no tag"
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
      - name: docker login (ghcr.io)
        # Both values reach the shell as environment variables rather than
        # through template expansion. github.actor is attacker-influenceable on
        # a fork PR, and an expansion is substituted into the script BEFORE the
        # shell parses it, so a crafted value is code rather than an argument.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # One build, and every later step names its output by digest. The image
      # is pushed untagged, each platform of that exact digest is scanned, and
      # only then does the digest get its tags, its signature and its SBOM
      # attestation. A registry digest is the hash of the bytes it names, so
      # the bytes published are the bytes scanned.
      - name: build + push by digest (multi-arch, untagged)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: operators/
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: ghcr.io/${{ github.repository }}/operator
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
      # Each scan names the index the build pushed and one platform, and trivy
      # reads that platform's manifest out of the index the digest names. The
      # scan fails if the image it read is any other platform.
      - name: scan linux/amd64
        uses: $/.github/actions/image-scan
        with:
          image: ghcr.io/${{ github.repository }}/operator@${{ steps.build.outputs.digest }}
          platform: linux/amd64
      - name: scan linux/arm64
        uses: $/.github/actions/image-scan
        with:
          image: ghcr.io/${{ github.repository }}/operator@${{ steps.build.outputs.digest }}
          platform: linux/arm64
      # The tags point at the scanned digest, and each is read back before
      # anything is signed: a tag that resolves anywhere else fails the job.
      - name: tag the scanned digest
        env:
          REPO: ghcr.io/${{ github.repository }}/operator
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:?*) ;;
            *) echo "::error::the build reported no image digest ('$DIGEST'); nothing to tag"; exit 1 ;;
          esac
          docker buildx imagetools create --tag "$REPO:$VERSION" --tag "$REPO:latest" "$REPO@$DIGEST"
          for ref in "$REPO:$VERSION" "$REPO:latest"; do
            got=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$ref" | jq -r .digest)
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$ref resolves to $got, not the scanned digest $DIGEST"
              exit 1
            fi
            echo "$ref -> $got"
          done
      # Sign and attest the digest the build pushed, never a tag. A tag is
      # mutable, so a signature taken through one covers whatever the tag pointed
      # at in that instant; the digest is what this build produced, and it is what
      # admission pins the pod to before verifying the bundles attached to it.
      #
      # `${{ }}` is substituted into the script TEXT before the shell sees it, so
      # a value containing shell metacharacters becomes part of the command.
      # Binding the reference to an environment variable makes it a string value
      # the shell expands, which no crafted value can escape.
      - name: sign (keyless, OIDC)
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/operator@${{ steps.build.outputs.digest }}
        run: |
          case "$IMAGE_REF" in
            *@sha256:?*) ;;
            *) echo "::error::the build step reported no digest; refusing to sign $IMAGE_REF"; exit 1 ;;
          esac
          cosign sign --yes "$IMAGE_REF"
      - name: sbom
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/operator@${{ steps.build.outputs.digest }}
        run: |
          syft "$IMAGE_REF" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE_REF"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-operator-${{ steps.ver.outputs.version }}
          path: sbom.spdx.json

  sandbox-worker-image:
    name: build + sign sandbox worker image
    if: startsWith(github.ref, 'refs/tags/sandbox-worker-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push this component's image to ghcr.io under this repository
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: derive version
        id: ver
        # An EMPTY version is not rejected downstream — it is a valid instruction.
        # `ghcr.io/owner/repo/sandbox-worker:` is a reference with no tag, which a
        # registry resolves rather than refuses, so the job would build, sign and
        # publish against something nobody proposed and report success.
        #
        # Asserted with a shell conditional rather than an external tool: a guard
        # that asks its question through a binary is deleted by the absence of
        # that binary. On refusal NOTHING is written to the output, so no later
        # step has a bad value to misread.
        #
        # The prefix is stripped inside the script: an `env:` value is passed to
        # the step verbatim, never through a shell, so a parameter expansion
        # written there reaches the script as its literal text.
        run: |
          RAW="${GITHUB_REF#refs/tags/sandbox-worker-v}"
          if [ -z "$RAW" ]; then
            echo "::error::derived an empty version from the sandbox-worker tag; refusing to tag an image with no tag"
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
      - name: docker login (ghcr.io)
        # Both values reach the shell as environment variables rather than
        # through template expansion. github.actor is attacker-influenceable on
        # a fork PR, and an expansion is substituted into the script BEFORE the
        # shell parses it, so a crafted value is code rather than an argument.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # One build, and every later step names its output by digest. The image
      # is pushed untagged, each platform of that exact digest is scanned, and
      # only then does the digest get its tags, its signature and its SBOM
      # attestation. A registry digest is the hash of the bytes it names, so
      # the bytes published are the bytes scanned.
      - name: build + push by digest (multi-arch, untagged)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: sandbox-worker/
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}/sandbox-worker
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
      # Each scan names the index the build pushed and one platform, and trivy
      # reads that platform's manifest out of the index the digest names. The
      # scan fails if the image it read is any other platform.
      #
      # sandbox-worker/.trivyignore.yaml names the fixed CRITICALs this image
      # acknowledges, the same file its ci.yaml job scans with.
      - name: scan linux/amd64
        uses: $/.github/actions/image-scan
        with:
          image: ghcr.io/${{ github.repository }}/sandbox-worker@${{ steps.build.outputs.digest }}
          platform: linux/amd64
          acknowledged: sandbox-worker/.trivyignore.yaml
      - name: scan linux/arm64
        uses: $/.github/actions/image-scan
        with:
          image: ghcr.io/${{ github.repository }}/sandbox-worker@${{ steps.build.outputs.digest }}
          platform: linux/arm64
          acknowledged: sandbox-worker/.trivyignore.yaml
      # The tags point at the scanned digest, and each is read back before
      # anything is signed: a tag that resolves anywhere else fails the job.
      - name: tag the scanned digest
        env:
          REPO: ghcr.io/${{ github.repository }}/sandbox-worker
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:?*) ;;
            *) echo "::error::the build reported no image digest ('$DIGEST'); nothing to tag"; exit 1 ;;
          esac
          docker buildx imagetools create --tag "$REPO:$VERSION" --tag "$REPO:latest" "$REPO@$DIGEST"
          for ref in "$REPO:$VERSION" "$REPO:latest"; do
            got=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$ref" | jq -r .digest)
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$ref resolves to $got, not the scanned digest $DIGEST"
              exit 1
            fi
            echo "$ref -> $got"
          done
      - name: sign (keyless, OIDC)
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/sandbox-worker@${{ steps.build.outputs.digest }}
        run: |
          case "$IMAGE_REF" in
            *@sha256:?*) ;;
            *) echo "::error::the build step reported no digest; refusing to sign $IMAGE_REF"; exit 1 ;;
          esac
          cosign sign --yes "$IMAGE_REF"
      - name: sbom
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/sandbox-worker@${{ steps.build.outputs.digest }}
        run: |
          syft "$IMAGE_REF" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE_REF"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-sandbox-worker-${{ steps.ver.outputs.version }}
          path: sbom.spdx.json

  eval-runner-image:
    name: build + sign eval runner image
    needs: plan
    if: needs.plan.outputs.eval_runner != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push this component's image to ghcr.io under this repository
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: derive version
        id: ver
        # An EMPTY version is not rejected downstream — it is a valid instruction.
        # `ghcr.io/owner/repo/eval-runner:` is a reference with no tag, which a
        # registry resolves rather than refuses, so the job would build, sign and
        # publish against something nobody proposed and report success.
        #
        # Asserted with a shell conditional rather than an external tool: a guard
        # that asks its question through a binary is deleted by the absence of
        # that binary. On refusal NOTHING is written to the output, so no later
        # step has a bad value to misread.
        env:
          RAW: "${{ needs.plan.outputs.eval_runner }}"
        run: |
          if [ -z "$RAW" ]; then
            echo "::error::derived an empty version from the plan job; refusing to tag an image with no tag"
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
      - name: docker login (ghcr.io)
        # Both values reach the shell as environment variables rather than
        # through template expansion. github.actor is attacker-influenceable on
        # a fork PR, and an expansion is substituted into the script BEFORE the
        # shell parses it, so a crafted value is code rather than an argument.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # One build, and every later step names its output by digest. The image
      # is pushed untagged, each platform of that exact digest is checked, and
      # only then does the digest get its tags, its signature and its SBOM
      # attestation. A registry digest is the hash of the bytes it names, so
      # the bytes published are the bytes checked; nothing rests on a second
      # build reproducing the first.
      - name: build + push by digest (multi-arch, untagged)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Repo root context: the image bundles the pnpm workspace (the runner
          # builds on @eks-agent/core + @eks-agent/pricing).
          context: .
          file: packages/eval-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}/eval-runner
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
      # The index the build pushed, resolved to the manifest digest of each
      # platform it was built for. The index is hashed before it is read, so
      # the children come from the index the digest names. Exactly one manifest
      # per platform, or the step fails: the checks below run against these
      # references, and a second candidate would leave which one was checked
      # to chance.
      - name: resolve each platform of the pushed digest
        id: platforms
        env:
          REPO: ghcr.io/${{ github.repository }}/eval-runner
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::the build reported no image digest ('$DIGEST'); nothing to check"; exit 1 ;;
          esac
          index="$RUNNER_TEMP/eval-runner-index.json"
          docker buildx imagetools inspect --raw "$REPO@$DIGEST" > "$index"
          read -r sum _ < <(sha256sum "$index")
          if [ "sha256:$sum" != "$DIGEST" ]; then
            echo "::error::the index fetched for $DIGEST hashes to sha256:$sum"
            exit 1
          fi
          for arch in amd64 arm64; do
            child=$(jq -r --arg arch "$arch" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
              | if length == 1 then .[0] else error("\(length) linux/\($arch) manifests") end
            ' "$index")
            echo "linux/$arch: $REPO@$child"
            echo "$arch=$REPO@$child" >> "$GITHUB_OUTPUT"
          done
      - name: check linux/amd64
        uses: $/.github/actions/eval-runner-image-check
        with:
          image: ${{ steps.platforms.outputs.amd64 }}
          platform: linux/amd64
      - name: check linux/arm64
        uses: $/.github/actions/eval-runner-image-check
        with:
          image: ${{ steps.platforms.outputs.arm64 }}
          platform: linux/arm64
      # The tags point at the checked digest, and each is read back before
      # anything is signed: a tag that resolves anywhere else fails the job.
      - name: tag the checked digest
        env:
          REPO: ghcr.io/${{ github.repository }}/eval-runner
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$REPO:$VERSION" --tag "$REPO:latest" "$REPO@$DIGEST"
          for ref in "$REPO:$VERSION" "$REPO:latest"; do
            got=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$ref" | jq -r .digest)
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$ref resolves to $got, not the checked digest $DIGEST"
              exit 1
            fi
            echo "$ref -> $got"
          done
      - name: sign (keyless, OIDC)
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/eval-runner@${{ steps.build.outputs.digest }}
        run: |
          case "$IMAGE_REF" in
            *@sha256:?*) ;;
            *) echo "::error::the build step reported no digest; refusing to sign $IMAGE_REF"; exit 1 ;;
          esac
          cosign sign --yes "$IMAGE_REF"
      - name: sbom
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/eval-runner@${{ steps.build.outputs.digest }}
        run: |
          syft "$IMAGE_REF" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE_REF"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-eval-runner-${{ steps.ver.outputs.version }}
          path: sbom.spdx.json

  charts-oci:
    name: package + push charts to OCI
    if: startsWith(github.ref, 'refs/tags/charts-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push this component's image to ghcr.io under this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Helm renders the charts these gates compare against, so its version is
          # part of the verdict. Unpinned, an unrelated pull request goes red or
          # green on a helm release rather than on a change here.
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.1
      - name: login
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: package + push
        env:
          REGISTRY: oci://ghcr.io/${{ github.repository }}/charts
        run: |
          set -euo pipefail

          # A charts-v tag packages every chart in charts/ at whatever version
          # its own Chart.yaml declares — the tag is only a trigger, it names no
          # version. So most tags re-push charts that did not change, and an OCI
          # tag is mutable: pushing 0.3.0 a second time replaces what every
          # cluster already resolved. Identical content makes that a no-op, but
          # a chart edited without a version bump would be swapped underneath
          # running clusters with nothing to say so.
          #
          # So this refuses to overwrite. For each chart the published version
          # is either absent (publish), byte-identical (skip), or different
          # (fail — the chart changed and the version did not).
          #
          # The comparison packages the source and compares the extracted
          # trees rather than the tarballs: helm rewrites Chart.yaml on package
          # (keys reordered, comments dropped) and stamps mtimes, so source and
          # registry only compare equal once both have been through
          # `helm package`.
          published=0
          skipped=0

          for d in charts/*/; do
            name=$(basename "$d")
            version=$(helm show chart "$d" | awk '/^version:/ {print $2; exit}')
            if [ -z "$version" ]; then
              echo "::error::${name}/Chart.yaml declares no version"
              exit 1
            fi

            # Per-chart output dir so the glob expansion in helm push has
            # exactly one match — sharing /tmp/charts/ across charts would
            # let helm push see multiple .tgz files and fail with
            # "exactly one positional argument expected".
            work="/tmp/charts/${name}"
            mkdir -p "${work}/candidate"
            helm package "$d" -d "$work"
            tgz="${work}/${name}-${version}.tgz"
            tar xzf "$tgz" -C "${work}/candidate"

            # Three outcomes, and anything else stops the job. An unrecognized
            # registry error must not fall through to a push — that is the one
            # path that could overwrite a live version. Login runs as its own
            # step above, so by here auth is established and `denied` means the
            # package does not exist yet (GHCR does not distinguish an absent
            # package from an unreadable one).
            state=unknown
            for attempt in 1 2 3; do
              if err=$(helm show chart "${REGISTRY}/${name}" --version "$version" 2>&1); then
                state=present
                break
              fi
              case "$err" in
                *"not found"*|*NAME_UNKNOWN*|*MANIFEST_UNKNOWN*|*denied*)
                  state=absent
                  break
                  ;;
              esac
              echo "attempt ${attempt}: could not read ${name} ${version}: ${err}"
              sleep 5
            done

            case "$state" in
              present)
                helm pull "${REGISTRY}/${name}" --version "$version" \
                  -d "$work" --untar --untardir published
                if diff -r "${work}/published/${name}" "${work}/candidate/${name}" >/dev/null; then
                  echo "skip ${name} ${version} — already published, identical content"
                  skipped=$((skipped + 1))
                  continue
                fi
                echo "::error::${name} ${version} is already published with different content."
                echo "The chart changed without a version bump. Bump ${name}/Chart.yaml"
                echo "and tag again — overwriting a published version would swap the chart"
                echo "underneath every cluster already resolving it."
                diff -r "${work}/published/${name}" "${work}/candidate/${name}" || true
                exit 1
                ;;
              absent)
                helm push "$tgz" "$REGISTRY"
                published=$((published + 1))
                ;;
              *)
                echo "::error::could not determine whether ${name} ${version} is published."
                echo "Refusing to push — the last error was: ${err}"
                exit 1
                ;;
            esac
          done

          echo "published=${published} skipped=${skipped}"

          # A charts-v tag that publishes nothing is a tag pushed without a
          # version bump. Passing green would report a release that did not
          # happen — the same shape as the alerting path this repo just deleted.
          if [ "$published" -eq 0 ]; then
            echo "::error::this tag published no chart — every chart in charts/ is already"
            echo "at its published version. Bump the chart you meant to release and tag again."
            exit 1
          fi

  sdk-npm:
    name: publish @eks-agent/* to npm
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    # NPM_TOKEN is a long-lived credential that can publish under the org scope,
    # and a job holding it needs an approval surface that a repository secret
    # does not have. Naming an environment is what makes required reviewers,
    # wait timers and branch restrictions applicable to this publish at all —
    # without one, any workflow change reaching this job publishes immediately.
    environment: npm-publish
    permissions:
      contents: write   # changeset publish writes git tags beside the npm publish
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      # No dependency cache on the publishing path — see the note on setup-go
      # above. The npm publish carries provenance, so what it attests has to be
      # a function of the commit rather than of a cache any workflow can write.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
