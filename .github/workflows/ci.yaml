name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  placeholders:
    name: zero-placeholder gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/no-placeholders.sh

  doc-contracts:
    name: doc contract gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/check-doc-contracts.sh

  # An SSM parameter is a contract between two things that never reference each
  # other, and the operator ignores keys it does not recognise — so publishing one
  # nobody reads is silent and looks exactly like a working contract.
  ssm-contract:
    name: ssm contract gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/check-ssm-contract.py

  # A pin Renovate cannot see does not announce that it has aged — it quietly
  # stops being current, and the pins that age worst are the security tools,
  # where a stale scanner reports a clean tree indistinguishably from a clean
  # tree. This asserts the classification rather than describing it: a comment
  # listing which files carry versions goes stale the first time someone adds
  # one, and nothing fails.
  version-pins:
    name: every version pin is Renovate-managed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/check-version-pins.py --self-test
      - run: ./scripts/check-version-pins.py --list

  # The contract lists three per-env deltas among the tenant chart's required
  # artifacts and says empty is still required. Three files that always exist
  # mean a deploy path can name one unconditionally; a file that exists only
  # when it has content makes every consumer branch on its absence, and the
  # branch nobody wrote deploys base values into production silently.
  tenant-chart-artifacts:
    name: tenant chart ships its required artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/check-tenant-chart-artifacts.py --list

  # A comment claiming to mirror a standard is a claim nothing keeps true. This
  # one had drifted a full generation before anything compared the two.
  model-tiers:
    name: model tiers match the org LLM policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: resolve the standards catalog
        run: |
          git clone --depth 1 https://github.com/nanohype/nanohype.git /tmp/nanohype
          echo "NANOHYPE_STANDARDS_DIR=/tmp/nanohype/standards" >> "$GITHUB_ENV"
      - run: ./scripts/check-model-tiers.py --list

  # shellcheck parses; it does not run. A static parser cannot know which bash a
  # reader has, so a runtime-version incompatibility is invisible to it — which
  # is how `declare -A` reached the local-kx installer, aborting it on every
  # macOS before a single prerequisite was checked.
  shell-portability:
    name: shell scripts run on the bash macOS ships
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: shell portability self-test
        env:
          # ubuntu-latest ships bash 5 and no 3.2, so the EXECUTION half of the
          # self-test cannot run here. It is opted out EXPLICITLY rather than
          # skipped silently: the step prints PARTIAL naming what it did not do,
          # and the pattern half — every rule against its construct and against
          # the 3.2-valid neighbour it is confusable with — still gates. The
          # execution half runs on any machine that has a 3.2, which is where
          # this table's claims about that shell were measured.
          SHELL_SELFTEST_ALLOW_PARTIAL: "1"
        run: ./scripts/check-shell-portability.py --self-test
      - run: ./scripts/check-shell-portability.py --list

  # Prose that names a path is a claim about the world, and the most checkable
  # one documentation makes. A file moves, the reference does not, and nothing
  # fails — the reader following it is the failure detector, which in a runbook
  # means during an incident.
  workflow-permissions:
    name: no workflow-level write permission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: pip install pyyaml
      - run: ./scripts/check-workflow-permissions.py --list

  merge-gate-reachable:
    name: every pull-request job blocks the merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: pip install pyyaml
      - run: ./scripts/check-merge-gate.py --list

  empty-tree:
    name: no gate passes on a tree with no repo content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: pip install pyyaml
      - run: ./scripts/check-empty-tree.py --list

  named-paths:
    name: every path named in prose resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/check-named-paths.py --list

  # Positive controls. A gate that has only been READ is a gate being trusted:
  # this repo shipped a parity gate that matched over raw source, so a
  # commented-out declaration above the live one won the search and the gate
  # reported the comment's members. It read correctly and it was blind.
  #
  # Each control makes the exact edit its gate exists to catch and requires a
  # non-zero exit — after asserting the gate passes CLEAN first (otherwise the
  # failure proves nothing) and after asserting the fixture actually CHANGED (a
  # mutation that silently no-ops hands the gate an unmodified file, and its
  # correct pass gets recorded as proof the control worked).
  #
  # A gate with no control fails this job, so the suite cannot quietly shrink.
  controls:
    name: every gate rejects its own violation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # check-chart-version-bump compares against the base ref.
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          # Helm renders the charts these gates compare against, so its version is
          # part of the verdict. Unpinned, an unrelated pull request goes red or
          # green on a helm release rather than on a change here.
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.0.5
      # This job runs EVERY gate for real, so it needs every binary any gate
      # asserts a precondition on — not only the ones its own name suggests.
      # check-vcluster-chart resolves the operator constants with go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: operators/go.mod
          cache-dependency-path: operators/go.sum
      - run: pip install pyyaml
      - run: ./scripts/check-controls.py --list

  # A gate over the gates. A check that cannot fail is worse than no check,
  # because the success it reports is what everything downstream reads — and
  # this repo's evidence that a dimension holds is largely "a gate covers it".
  # Runs its own self-test first, since a meta-gate that cannot fail is the same
  # defect one level up.
  gates:
    name: every gate can reject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: pip install pyyaml
      - run: ./scripts/check-gates.py --self-test
      - run: ./scripts/check-gates.py --list

  # Three declarations of one closed set, in two languages, with a JSON boundary
  # between them and no type system spanning it. A value the TypeScript side is
  # missing is not a compile error anywhere — the runner takes its other branch
  # and posts the wrong body at a gateway that reports healthy.
  route-api-parity:
    name: RouteAPI agrees across its declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/check-route-api-parity.py --list

  # A gate on a mutable field has to subscribe to the event that mutates it, or
  # it reports on a version of the PR that no longer exists.
  workflow-triggers:
    name: metadata gates can observe their subject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: pip install pyyaml
      - run: ./scripts/check-workflow-triggers.py --list

  # Three environments run the same component on the same substrate shape, so a
  # decision one of them had to make is a decision all of them have to make. The
  # value may differ; whether the question was asked may not.
  leaf-input-parity:
    name: leaf input parity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/check-leaf-input-parity.py --self-test
      - run: ./scripts/check-leaf-input-parity.py --list

  format:
    name: format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: "1.12.6"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: operators/go.mod
          cache-dependency-path: operators/go.sum
      - run: pnpm install --frozen-lockfile
      - run: tofu fmt -check -recursive terraform/
      - run: pnpm format:check
      # `test -z "$(gofmt -l .)"` passes when gofmt is ABSENT, because the
      # substitution is then empty and the emptiness is what was being tested.
      # An absent tool deleted the guard rather than tripping it. Presence is
      # asserted first, and the file list is captured once so the verdict and
      # the report cannot disagree.
      - name: gofmt
        run: |
          cd operators
          command -v gofmt >/dev/null || {
            echo "gofmt is not on PATH; nothing was checked."
            exit 3
          }
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: every file is formatted"
      # The three formatters above each own a language: tofu fmt for Terraform,
      # biome for TS and JSON, gofmt for Go. .editorconfig declares charset, LF
      # endings, a final newline and no trailing whitespace for *every* file, and
      # nothing observed those on the rest of the tree — YAML, HCL, Markdown,
      # shell, the chart templates.
      #
      # Indentation checks stay off, because the three formatters above are the
      # authority there and a Makefile needs tabs for its recipes and spaces for
      # the continuation lines inside them. This takes the rules nothing else owns.
      - run: pnpm editorconfig

  tofu:
    name: tofu validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: "1.12.6"
      - name: validate every component
        run: |
          for d in terraform/components/*/; do
            name=$(basename "$d")
            echo "::group::$name"
            (cd "$d" && tofu init -backend=false -input=false && tofu validate)
            echo "::endgroup::"
          done

      # EVERY suite in the tree runs, not only the ones attached to a bucket.
      #
      # This loop is deliberately independent of the teardown check below, which
      # enumerates bucket-bearing components. Coupling the two makes a component's
      # tests run only if it happens to create an S3 bucket — cost-access asserts that
      # the operator can decrypt what it queries, that its grant reaches the account
      # CUR, and that its handles land in the subtree the operator actually sweeps,
      # and it creates no bucket. A test that does not run is a comment that costs
      # money to write.
      - name: tofu test
        run: |
          failed=""
          vacuous=""
          ran=0
          for d in terraform/components/*/; do
            name=$(basename "$d")
            ls "$d"tests/*.tftest.hcl >/dev/null 2>&1 || continue
            echo "::group::$name"
            if out=$(cd "$d" && tofu test -no-color 2>&1); then
              echo "$out"
            else
              echo "$out"
              failed="${failed}${failed:+ }$name"
            fi
            echo "::endgroup::"
            # A suite that EXISTS is not a suite that ASSERTED. A file of comments, or
            # one whose run blocks were commented out, exits 0 exactly like a passing
            # one, so read the count rather than the status.
            #
            # This is a floor and not a proof: it catches a suite that ran nothing. It
            # cannot catch a run whose assertions are tautologies, because nothing in
            # the output distinguishes those from real ones. Whether an assertion can
            # fail is established by mutating the component and watching the suite go
            # red — a thing a human does, not a thing this step can claim.
            if ! echo "$out" | grep -qE '[1-9][0-9]* passed'; then
              vacuous="${vacuous}${vacuous:+ }$name"
            fi
            ran=$((ran + 1))
          done
          if [ -n "$failed" ]; then
            echo "::error::tofu test failed for: $failed"
            exit 1
          fi
          if [ -n "$vacuous" ]; then
            echo "::error::these components have a tests/ directory that asserted nothing: $vacuous"
            echo "  Zero passing runs and a zero exit code are indistinguishable from a suite that"
            echo "  ran and held. Whatever is in tests/ has to actually execute a run block."
            exit 1
          fi
          if [ "$ran" -eq 0 ]; then
            echo "::error::discovered no component suites — this step cannot have verified anything"
            exit 1
          fi
          echo "ran $ran component suite(s)"

      # Teardown posture is asserted, not assumed. These components' buckets are
      # root-module resources, so a test `assert` reads the attribute the provider will
      # send rather than an output restating the expression that produced it — which is
      # what makes a value assertion bind here at all.
      #
      # Both directions matter. With only the permissive assertion, a bucket wired
      # force_destroy = true unconditionally passes and the protection is gone with
      # nothing to show for it; with only the protective one, the teardown wedge that
      # strands a cluster, a VPC and its NAT gateways comes back.
      #
      # This step establishes the OBLIGATION — a component that creates a bucket must
      # carry a suite — while the step above runs it. Enumerated from the tree rather
      # than from the directories that happen to have tests, because those two agreeing
      # is the whole property: a loop over `tests/` dirs reports the same green when a
      # suite is deleted, when a directory is renamed, and when a new bucket-bearing
      # component lands with no suite at all. A gate whose healthy output matches its
      # did-nothing output is the failure it exists to catch.
      - name: teardown posture
        run: |
          missing=""
          ran=0
          for d in terraform/components/*/; do
            name=$(basename "$d")
            # Tolerant of leading whitespace and of extra spaces after `resource`,
            # both of which are legal HCL that a `^resource "` anchor walks straight
            # past; of the JSON syntax, where the type is an object key; and of
            # directory buckets, which are a different type and the same teardown
            # problem. What it still cannot see is a bucket created inside a module —
            # no component here uses one, and if that changes this predicate is the
            # thing to replace rather than to extend.
            grep -qRE '(^[[:space:]]*resource[[:space:]]+"aws_s3_(directory_)?bucket"|"aws_s3_(directory_)?bucket"[[:space:]]*:)' \
              "$d" --include='*.tf' --include='*.tf.json' || continue
            # Presence of a tests/ DIRECTORY is not presence of a test. `tofu test`
            # against an empty one prints "Success! 0 passed, 0 failed." and exits 0,
            # so a component could land with a bucket, an empty suite, and a green
            # gate. Require a suite file to exist at all.
            if ! ls "$d"tests/*.tftest.hcl >/dev/null 2>&1; then
              missing="${missing}${missing:+ }$name"
              continue
            fi
            ran=$((ran + 1))
          done
          if [ -n "$missing" ]; then
            echo "::error::these components create S3 buckets and carry no teardown suite: $missing"
            echo "  A bucket with no force_destroy wedges the reverse sweep on BucketNotEmpty and"
            echo "  leaves the cluster, VPC and NAT gateways billing. Add tests/teardown.tftest.hcl."
            exit 1
          fi
          if [ "$ran" -eq 0 ]; then
            echo "::error::discovered no components with S3 buckets — this step cannot have verified anything"
            exit 1
          fi
          echo "teardown posture required of $ran component(s)"
          echo "teardown posture asserted for $ran component(s)"

  # ── Chart RBAC gate ──────────────────────────────────────────────────────
  # operators/config/rbac/role.yaml IS generated by controller-gen from the
  # kubebuilder markers. The operator chart's manager ClusterRole is NOT — it is
  # hand-maintained, and it drifted: the markers declared `impersonate` on users
  # and CRUD on clusterroles/clusterrolebindings, and the chart shipped neither.
  #
  # The operator could not create the impersonation RBAC its Platform controller
  # exists to create, its ClusterRole informer never synced, and every Platform CR
  # hung in phase=Provisioning — on a cluster where every pod was Running and every
  # ArgoCD Application was Healthy. helm lint, helm template, kubeconform and trivy
  # all passed: the manifests were valid, they just granted less than the code needs.
  #
  # A marker is a promise the chart has to keep. This asserts it does.
  chart-rbac:
    name: chart rbac covers markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: pip install pyyaml
      - run: ./scripts/check-chart-rbac.py

  # ── Chart↔CRD parity gate ────────────────────────────────────────────────
  # The Platform CRD is mirrored in four places. Three were gated: the generated
  # CRD + reference (crd-docs job), packages/core/src/schemas.ts
  # (check-schema-drift), and the operator chart's RBAC (chart-rbac). charts/tenant
  # was not, and it drifted — the CRD grew spec.datastores,
  # identity.capabilities, identity.directSecretReads and spec.attribution while
  # the chart every vending path renders could express none of them. Nothing
  # failed: the rendered Platform was valid, it just declared less than a tenant
  # needs.
  #
  # A field the chart cannot emit is a field agentctl, portal and ArgoCD cannot
  # set. This asserts the chart reaches all of them, emits nothing outside the
  # CRD, and still rejects the declarations the CRD would.
  chart-crd-parity:
    name: chart covers the Platform CRD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          # Helm renders the charts these gates compare against, so its version is
          # part of the verdict. Unpinned, an unrelated pull request goes red or
          # green on a helm release rather than on a change here.
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.0.5
      - run: pip install pyyaml
      - run: ./scripts/check-chart-crd-parity.py

  # ── CRD instantiation ────────────────────────────────────────────────────
  # chart-crd-parity above holds the chart faithful to the Platform CRD, so it
  # is blind to a kind the chart cannot emit at all. SLOPolicy shipped that way:
  # a Go type, a generated CRD, a registered controller, conformance tests, a
  # kube-state-metrics projection and three Grafana alerts, with no CR anywhere
  # in the org. Every gate passed, because every gate asked whether the artifact
  # was well-formed and none asked whether anything ever creates one.
  #
  # Also asserts each rendered platformRef resolves to a Platform in the same
  # namespace of the same render, which is the half a `kind:` grep cannot do —
  # the ref resolves same-namespace by name, so a CR in the workload namespace
  # reports PlatformNotFound and nothing else.
  crd-instantiation:
    name: every shipped CRD kind is instantiated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          # Helm renders the charts these gates compare against, so its version is
          # part of the verdict. Unpinned, an unrelated pull request goes red or
          # green on a helm release rather than on a change here.
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.0.5
      - run: pip install pyyaml
      - run: ./scripts/check-crd-instantiation.py

  # ── PROJECT parity ───────────────────────────────────────────────────────
  # operators/PROJECT is kubebuilder's scaffolding record and nothing reads it at
  # runtime, which is exactly why it drifts. Deleting the batch tier removed its
  # types, controller, CRD and RBAC while PROJECT went on declaring a BatchJob
  # API with a controller behind it — at the front door of the repo an agent
  # reads to learn what this operator is, with every other gate green.
  project-resources:
    name: PROJECT matches the shipped CRDs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/check-project-resources.py

  # ── chart args parity ────────────────────────────────────────────────────
  # The other half of the same deletion. PROJECT kept declaring the batch API;
  # the chart kept passing --batch-workers and --batch-poll-interval to a binary
  # that no longer defines them. Go's flag package exits 2 on an unknown
  # argument, so the operator pod CrashLoopBackOffs before the manager starts —
  # and every existing gate stayed green, because the chart renders, lints and
  # validates, the binary compiles and tests, and nothing joins the two until an
  # install is already running.
  chart-args:
    name: chart passes only flags the binary defines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/check-chart-args.py

  # ── Chart version bump gate ──────────────────────────────────────────────
  # An OCI tag is mutable, so republishing a version replaces the bytes every
  # cluster already resolved. The release job refuses to do that — but it runs
  # on a charts-v tag, which is after the merge, so the defect presents as
  # "every future chart release is blocked" rather than "this PR may not merge".
  # It happened twice that way: charts/tenant at 0.4.0, then charts/operator at
  # 0.6.3, where values.schema.json and a README correction landed under a
  # version that was already published without them. The schema existed in
  # source and in no artifact while eks-gitops pinned that exact version.
  #
  # This asks the same question at the merge boundary. It compares PACKAGED
  # trees, not the working tree: helm drops Chart.yaml's comments on package, so
  # a comment-only edit changes nothing that ships and must not demand a bump —
  # the self-test holds that line with a case that has to stay green.
  chart-version-bump:
    name: a changed chart carries a version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The comparison needs the merge base. Without full history there is no
          # left-hand side, and the gate refuses to run rather than pass vacuously.
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          # Helm renders the charts these gates compare against, so its version is
          # part of the verdict. Unpinned, an unrelated pull request goes red or
          # green on a helm release rather than on a change here.
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.0.5
      - run: ./scripts/check-chart-version-bump.py --self-test
      # base_ref is a ref name the PR author does not control, but it is still a
      # template expansion landing inside a command line; passing it through the
      # environment keeps the script's argv a function of the variable rather
      # than of the substitution.
      - env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: ./scripts/check-chart-version-bump.py --base "origin/$BASE_REF"

  # ── eval workflow gate ───────────────────────────────────────────────────
  # The eval pipeline was dead twice over, and both failures were invisible to
  # helm lint, helm template, kubeconform and trivy, because nothing was wrong
  # with the YAML. Its namespace enforces the restricted Pod Security Standard
  # and the WorkflowTemplate carried no securityContext, so PSA — a built-in
  # plugin with no exclusion list — rejected every step pod. And the score step
  # used $RANDOM under /bin/sh, which is dash in that image, so `set -u` killed
  # it on the line itself before it scored anything.
  #
  # Both are the same shape: a perfectly valid manifest that cannot work. This
  # asserts the containers satisfy the profile the namespace actually enforces
  # (read from the namespace, not hardcoded), and that no POSIX-shell script
  # uses a bash-only construct.
  eval-workflow:
    name: the eval workflow can be admitted and can run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          # Helm renders the charts these gates compare against, so its version is
          # part of the verdict. Unpinned, an unrelated pull request goes red or
          # green on a helm release rather than on a change here.
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.0.5
      - run: pip install pyyaml
      - run: ./scripts/check-eval-workflow.py

  # ── runtime contract gate ────────────────────────────────────────────────
  # The chart and the binary are one contract in two files: the eval
  # WorkflowTemplate DECLARES the parameters a run needs, the reconciler
  # SUPPLIES them. They version separately, so a chart can name a binary from a
  # different generation of that contract with every other gate still green.
  #
  # Chart 0.6.2 did exactly that — a three-parameter route contract
  # (model-route-base-url / model-route / model-route-api) with appVersion still
  # naming the 0.5.0 image, whose reconciler sent `gateway-url` and none of the
  # three. check-image-refs asks whether the image RESOLVES, which it does;
  # nothing asked whether it was the same generation as the templates beside it.
  #
  # It fails quietly rather than loudly, which is why it needs a gate: the three
  # parameters carry REPLACE_BY_EVALSUITE defaults (Argo v4+ rejects a null
  # value), so an old reconciler does not crash the run — it lets it POST to
  # that literal string and score every case zero, reading as a failed model
  # rather than a mispaired release.
  #
  # fetch-depth: 0 because the check resolves appVersion to source through the
  # release tag, and a shallow checkout has no tags to resolve it with.
  runtime-contract:
    name: the chart names an image that honours its contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: pip install pyyaml
      - run: ./scripts/check-runtime-contract.py --list

  # ── vcluster chart acceptance gate ───────────────────────────────────────
  # buildVClusterValues returns a map[string]interface{} that nothing checks
  # against the chart it is handed to. The unit tests assert what the operator
  # EMITS; they pass just as happily against a chart version that renamed the
  # path out from under them. So a bump could ship green and break the isolation
  # tier at sync, on every vcluster-isolated tenant — and 0.36.0 really did
  # remove sync.toHost.volumeSnapshots.
  #
  # A clean render is not sufficient either: 0.35.2 -> 0.36.1 drops the
  # ClusterRole and ClusterRoleBinding with helm exiting 0. This renders the
  # operator's own values (exported through buildVClusterValues, not restated)
  # against the pinned chart and diffs the object set against a committed
  # inventory, so a silent drop fails as loudly as a rejected key.
  vcluster-chart:
    name: the pinned vcluster chart accepts what the operator emits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: operators/go.mod
          cache-dependency-path: operators/go.sum
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          # Helm renders the charts these gates compare against, so its version is
          # part of the verdict. Unpinned, an unrelated pull request goes red or
          # green on a helm release rather than on a change here.
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.0.5
      - run: pip install pyyaml
      - run: ./scripts/check-vcluster-chart.py

  # helm lint, template rendering and CRD parity all read the chart against
  # itself. None of them asks whether the image it tells a cluster to pull
  # exists — so `appVersion` can drift arbitrarily far ahead of the newest
  # published operator tag while every other gate stays green.
  #
  # Keep this job name stable — it is a required status check on main, and it is
  # what makes tag-only releases safe. release.yaml builds on tags only, so
  # nothing downstream repairs a chart that points at an unpublished image; this
  # is the thing that stops one merging.
  # Enumeration only — the half that is a fact about THIS commit. Whether a
  # registry can serve the reference is a fact about the world, and a merge that
  # fails because GHCR had an outage teaches people to bypass the gate rather
  # than to fix anything. That half moved to chart-drift.yaml's schedule.
  image-refs:
    name: image references are internally consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/check-image-refs.py --offline --list

  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          # Helm renders the charts these gates compare against, so its version is
          # part of the verdict. Unpinned, an unrelated pull request goes red or
          # green on a helm release rather than on a change here.
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.0.5
      - run: |
          for d in charts/*/; do
            name=$(basename "$d")
            echo "::group::$name lint"
            helm lint "$d"
            echo "::endgroup::"
            echo "::group::$name template"
            # tenant chart requires platform.name + platform.tenant; pass
            # placeholders so template-rendering succeeds in CI.
            if [[ "$name" == "tenant" ]]; then
              helm template "$name" "$d" \
                --set platform.name=ci-smoke \
                --set platform.tenant=ci-smoke >/dev/null
            elif [[ "$name" == "operator" ]]; then
              # Default state, then the gated eval path so the Files.Get-wrapped
              # Argo CRs are exercised (they don't render at the defaults —
              # rollouts is off). Only flags the chart actually reads: `slo.*`
              # exists on charts/tenant, not here, and this chart has no
              # evalRuntime.serviceAccount.roleArn — Pod Identity binds the role
              # in AWS, so no ARN is injected. Both were passed here for a while
              # and set nothing, while the comment claimed they exercised the
              # alerting CRs.
              helm template "$name" "$d" >/dev/null
              helm template "$name" "$d" \
                --set evalRuntime.rollouts.enabled=true \
                --set evalRuntime.evalReportsBucket=ci-smoke-bucket >/dev/null
            else
              helm template "$name" "$d" >/dev/null
            fi
            echo "::endgroup::"
          done

  ts:
    name: pnpm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm test = turbo run lint typecheck test:coverage — each package's
      # vitest.config.ts layers measured coverage floors on vitest.base.ts,
      # so coverage can't silently regress.
      - run: pnpm test

  operator:
    # Keep this job name stable — it is a required status check on main.
    name: go test (envtest)
    runs-on: ubuntu-latest
    env:
      GOLANGCI_VERSION: v2.12.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: operators/go.mod
          cache-dependency-path: operators/go.sum
      # make coverage-check runs the envtest + unit suite over a merged
      # -coverpkg=./internal/... profile, then enforces the org coverage floor
      # per package (75%), a per-file 100% on the security-critical IAM/KMS
      # paths, and documented lower floors for agentctl/awsclients. A drop below
      # any floor fails here rather than shipping an unproven control.
      # promtool executes the PromQL the SLO reconciler builds against synthetic
      # series, so the assertion is the number that comes out rather than the
      # query string going in. REQUIRE_PROMTOOL turns the local "skip if absent"
      # into a hard failure here — a runner that lost the binary must not report
      # a green suite that executed none of those cases.
      - name: install promtool
        env:
          PROMTOOL_VERSION: "3.14.0"
        run: |
          set -euo pipefail
          ver="${PROMTOOL_VERSION}"
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${ver}/prometheus-${ver}.linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          sudo install -m 0755 "/tmp/prometheus-${ver}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version
      - name: go test with envtest + coverage floors
        env:
          REQUIRE_PROMTOOL: "1"
        run: cd operators && make coverage-check
      # verify: false because the JSONSchema check it performs by default is a
      # network fetch of https://golangci-lint.run/jsonschema/... on every run,
      # and that host timing out fails the job with nothing wrong in the tree.
      # The linter still parses .golangci.yml and rejects an unusable config —
      # what is given up is schema-level validation of a file this repo pins to
      # one linter version anyway.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: operators
          version: ${{ env.GOLANGCI_VERSION }}
          verify: false

  # ── Generated CRD reference drift gate ───────────────────────────────────
  # docs/crd-reference/v1alpha1.md, the CRD manifests under config/crd, the
  # manager RBAC under config/rbac, and the deepcopy code are all generated from
  # the Go API types (make crd-docs → controller-gen + crd-ref-docs). A type
  # change that isn't regenerated drifts the published reference and the shipped
  # CRDs from the code. Regenerate and diff so it can't.
  crd-docs:
    name: crd reference in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: operators/go.mod
          cache-dependency-path: operators/go.sum
      # `make manifests` rather than `make crd-docs`: it runs the same generation
      # AND copies the generated CRDs into the chart. The chart copy is diffed
      # below because it is the only thing that actually reaches a cluster — a
      # new CRD that lands in config/crd but not in charts/operator/crds is
      # invisible to every gate here and never gets installed.
      - run: cd operators && make manifests
      - name: fail on drift
        run: git diff --exit-code -- docs/crd-reference operators/config/crd operators/config/rbac operators/api charts/operator/crds

  docs:
    name: typedoc builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the API reference for every workspace package; fails on a broken
      # doc reference or a type error typedoc surfaces.
      - run: pnpm run docs

  # ── Generated-artifact drift gate ────────────────────────────────────────
  # The Lambda cost-publisher price table (pricing_data.py) is generated from a
  # single source of truth (packages/pricing/src/data/bedrock-pricing.json). A
  # hand-edit of the generated file, or a change to the source that wasn't
  # regenerated, drifts the meter from the SSOT. Regenerate and diff so it can't.
  generated:
    name: generated files in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
      - run: node scripts/gen-lambda-pricing.mjs --check
      # The refresh script's own checks: the Price List classifiers, and that
      # every model in the SSOT declares the AWS product name the refresh joins
      # on. Needs no AWS credentials — a model with no declaration, or a
      # dimension parsed as the wrong price, is caught here rather than on
      # whoever next runs the credentialed refresh.
      - run: node scripts/refresh-pricing.mjs --self-test

  # ── TS↔CRD schema mirror drift gate ──────────────────────────────────────
  # packages/core/src/schemas.ts declares zod schemas mirroring the operator's
  # CRD types — the runtime contract the typed client (packages/client) reads
  # CRs through. zod strips unknown keys, so a field the operator writes but the
  # zod schema doesn't model is silently invisible to consumers. This gate diffs
  # each mirrored zod schema's spec/status property tree against the generated
  # CRD OpenAPI schema and fails on divergence — the same regenerate-and-diff
  # discipline as the crd-docs and generated (pricing) gates, closing the one
  # mirror the lattice was missing.
  schema-drift:
    name: ts↔crd schema mirror in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:schema-drift

  lambda:
    name: cost-pipeline lambda tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -r terraform/components/cost-pipeline/lambda/requirements-test.txt
      - name: unit tests
        working-directory: terraform/components/cost-pipeline/lambda
        run: python -m unittest -v

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    needs:
      [
        placeholders,
        doc-contracts,
        ssm-contract,
        gates,
        controls,
        named-paths,
        workflow-permissions,
        merge-gate-reachable,
        empty-tree,
        shell-portability,
        model-tiers,
        tenant-chart-artifacts,
        version-pins,
        route-api-parity,
        workflow-triggers,
        leaf-input-parity,
        format,
        tofu,
        chart-rbac,
        chart-crd-parity,
        crd-instantiation,
        project-resources,
        chart-args,
        chart-version-bump,
        eval-workflow,
        runtime-contract,
        vcluster-chart,
        image-refs,
        helm,
        ts,
        operator,
        crd-docs,
        docs,
        generated,
        schema-drift,
        lambda,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@90af851a854ca24dd6626ccc660b0b1b245c406a # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate
